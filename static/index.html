<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transactions</title>
<style>
  :root {
    --page: #f6f6f4;
    --surface: #ffffff;
    --ink: #1f2328;
    --muted: #636c76;
    --rule: #e4e6ea;
    --rule-strong: #d0d4da;
    --accent: #0f6b6b;
    --accent-ink: #0b5252;
    --accent-wash: #e7f3f2;
    --accent-wash-strong: #d2e8e6;
    --edit-wash: #fff6dc;
    --edit-line: #b8860b;
    --hover: #f2f3f5;
    --credit: #1a7f4b;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 14px rgba(31, 35, 40, 0.05);
    --shadow-pop: 0 6px 22px rgba(31, 35, 40, 0.14), 0 1px 3px rgba(31, 35, 40, 0.1);
    --radius: 10px;
    --radius-sm: 6px;
    --focus: 0 0 0 3px rgba(15, 107, 107, 0.28);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    margin: 0;
    padding: 2rem 2.5rem 4rem;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 1.25rem;
  }

  button, input, select {
    font: inherit;
    color: inherit;
  }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: none;
    box-shadow: var(--focus);
  }

  /* --- tabs ----------------------------------------------------------- */
  #tabs {
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid var(--rule-strong);
    margin-bottom: 1.5rem;
  }
  #tabs button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 0.6rem 0.9rem;
    color: var(--muted);
    cursor: pointer;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    transition: color 120ms ease, background 120ms ease;
  }
  #tabs button:hover {
    color: var(--ink);
    background: rgba(31, 35, 40, 0.04);
  }
  #tabs button.active {
    color: var(--accent-ink);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  /* --- filters -------------------------------------------------------- */
  #filters {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.1rem 1.25rem 0.35rem;
    margin-bottom: 1.5rem;
  }
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem 1.75rem;
    align-items: flex-end;
    margin-bottom: 0.9rem;
  }
  .filter-row label {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .filter-row select,
  .filter-row input[type="date"] {
    min-width: 12rem;
    padding: 0.42rem 0.6rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.92rem;
  }
  .filter-row select:hover,
  .filter-row input[type="date"]:hover {
    border-color: #b6bcc4;
  }
  .filter-row label.inline {
    flex-direction: row;
    align-items: center;
    gap: 0.5rem;
    color: var(--ink);
    font-size: 0.9rem;
    padding-bottom: 0.45rem;
    cursor: pointer;
  }
  input[type="checkbox"] {
    width: 1rem;
    height: 1rem;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* --- status / messages --------------------------------------------- */
  #status, #review-status {
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 0.9rem;
  }
  .error {
    color: var(--danger);
    background: #fdf0ef;
    border: 1px solid #f3c9c5;
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.9rem;
    font-size: 0.92rem;
    margin-bottom: 1rem;
  }
  .mode-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 1.1rem;
    margin-bottom: 0.9rem;
    font-size: 0.9rem;
  }
  .mode-bar .mode-label {
    color: var(--muted);
  }
  .mode-option {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
  }
  .mode-option input[type="radio"] {
    accent-color: var(--accent);
    margin: 0;
  }
  .mode-option.threshold {
    color: var(--muted);
  }
  .mode-option.threshold input {
    width: 4.2rem;
    padding: 0.25rem 0.4rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .mode-note {
    color: var(--muted);
    font-size: 0.9rem;
    margin: -0.4rem 0 0.9rem;
  }
  .nothing-left {
    background: var(--surface);
    border: 1px dashed var(--rule-strong);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* --- tables --------------------------------------------------------- */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    /* No overflow:hidden here -- it would clip the "change" dropdown, which
       is positioned inside a cell. The corners are rounded per-cell below. */
  }
  thead th:first-child { border-top-left-radius: var(--radius); }
  thead th:last-child { border-top-right-radius: var(--radius); }
  tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius); }
  tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius); }
  th, td {
    text-align: left;
    padding: 0.7rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    vertical-align: middle;
  }
  th {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    background: #fafafb;
    letter-spacing: 0.01em;
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  /* Full-row hover: paint every cell, and keep the row's own state colours
     (selected / editing) on top of it. */
  tbody tr:hover td {
    background: var(--hover);
  }
  tbody tr.group:hover td {
    background: #eef0f2;
  }
  tr.selected td,
  tbody tr.selected:hover td {
    background: var(--accent-wash);
  }
  tr.editing td,
  tbody tr.editing:hover td {
    background: var(--edit-wash);
  }

  th.num, td.num {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  th.amount, td.amount {
    text-align: right;
  }
  td.amount.credit {
    color: var(--credit);
  }
  th.type, td.type {
    width: 6rem;
  }
  .pill {
    display: inline-block;
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .pill.debit {
    color: var(--muted);
    background: #f0f1f3;
    border-color: #e2e4e8;
  }
  .pill.credit {
    color: var(--credit);
    background: #e8f5ee;
    border-color: #cfe9d9;
  }
  #review-table th.select, td.select {
    width: 2.5rem;
    padding-right: 0;
  }

  /* --- buttons -------------------------------------------------------- */
  button.small, .selection-bar button {
    font-size: 0.82rem;
    font-weight: 500;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  button.small:hover:not(:disabled), .selection-bar button:hover:not(:disabled) {
    background: var(--accent-wash);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button.small:disabled, .selection-bar button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button.link, .selection-bar button.link {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button.link:hover, .selection-bar button.link:hover {
    color: var(--accent-ink);
    background: none;
  }

  /* --- Review & assign: selection bar ---------------------------------- */
  .selection-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem 1.1rem;
    align-items: center;
    background: var(--accent-wash);
    border: 1px solid var(--accent-wash-strong);
    border-radius: var(--radius);
    padding: 0.7rem 1rem;
    margin-bottom: 1rem;
    color: var(--accent-ink);
  }
  .selection-bar .label {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .typeahead {
    position: relative;
  }
  .typeahead input {
    min-width: 17rem;
    padding: 0.38rem 0.65rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 0.92rem;
  }
  .menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 10;
    min-width: 100%;
    max-height: 16rem;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-pop);
    padding: 0.25rem 0;
    color: var(--ink);
  }
  .menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 0;
    padding: 0.42rem 0.8rem;
    font-size: 0.92rem;
    font-weight: 400;
    cursor: pointer;
    white-space: nowrap;
  }
  .menu button:hover, .menu button:focus {
    background: var(--accent-wash);
    color: var(--accent-ink);
    outline: none;
    box-shadow: none;
  }
  .menu button.create {
    color: var(--accent);
    font-weight: 500;
  }
  .menu .empty {
    padding: 0.42rem 0.8rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* --- Review & assign: group header ----------------------------------- */
  tr.group td {
    background: #f4f5f7;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule);
    padding: 0.55rem 0.9rem;
  }
  tbody tr:first-child.group td {
    border-top: none;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    flex-wrap: wrap;
  }
  .group-head .toggle {
    width: 1.6rem;
    height: 1.6rem;
    border: none;
    border-radius: var(--radius-sm);
    background: none;
    cursor: pointer;
    position: relative;
    flex: none;
  }
  .group-head .toggle::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0.45rem;
    height: 0.45rem;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: translate(-50%, -65%) rotate(45deg);
    transition: transform 140ms ease;
  }
  tr.group.collapsed .toggle::before {
    transform: translate(-65%, -50%) rotate(-45deg);
  }
  .group-head .toggle:hover {
    background: rgba(31, 35, 40, 0.06);
  }
  .group-head .title {
    font-weight: 600;
  }
  .group-head .meta {
    color: var(--muted);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  .group-head .spacer {
    flex: 1;
  }

  /* --- Review & assign: category cell ---------------------------------- */
  td.category-cell {
    position: relative;
    white-space: nowrap;
    min-width: 20rem;
  }
  td.category-cell .sug {
    font-weight: 600;
  }
  td.category-cell .conf {
    font-size: 0.8rem;
    margin-left: 0.45rem;
    font-variant-numeric: tabular-nums;
  }
  td.category-cell .conf.high { color: var(--credit); }
  td.category-cell .conf.mid  { color: #9a6700; }
  td.category-cell .conf.low  { color: var(--muted); }
  td.category-cell .badge {
    display: inline-block;
    font-size: 0.78rem;
    line-height: 1;
    padding: 0.28rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.6rem;
    font-variant-numeric: tabular-nums;
  }
  td.category-cell .badge.similarity {
    color: var(--accent-ink);
    background: var(--accent-wash);
    border: 1px solid var(--accent-wash-strong);
  }
  td.category-cell .badge-label {
    color: var(--muted);
    font-size: 0.8rem;
    margin-right: 0.35rem;
  }
  td.category-cell .needs {
    color: #9a6700;
    font-size: 0.85rem;
  }
  td.category-cell .actions {
    display: inline-flex;
    gap: 0.4rem;
    margin-left: 0.7rem;
    vertical-align: middle;
  }

  /* --- Review & assign: "change" dropdown ------------------------------ */
  .editor {
    position: absolute;
    top: calc(100% - 4px);
    right: 0.9rem;
    z-index: 10;
    min-width: 17rem;
    background: var(--surface);
    border: 1px solid var(--edit-line);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-pop);
    font-size: 0.92rem;
    white-space: normal;
    overflow: hidden;
  }
  .editor .spread {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    padding: 0.55rem 0.8rem;
    border-bottom: 1px solid var(--rule);
    background: var(--edit-wash);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .editor .list {
    max-height: 14rem;
    overflow-y: auto;
    padding: 0.25rem 0;
  }
  .editor .list button, .editor .add-new {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 0.42rem 0.8rem;
    cursor: pointer;
  }
  .editor .list button:hover, .editor .list button:focus {
    background: var(--edit-wash);
    outline: none;
    box-shadow: none;
  }
  .editor .add-new {
    border-top: 1px solid var(--rule);
    color: var(--accent);
    font-weight: 500;
  }
  .editor .add-new:hover {
    background: var(--accent-wash);
  }
  .editor .new-input {
    padding: 0.6rem 0.8rem 0.3rem;
  }
  .editor .new-input input {
    width: 100%;
    padding: 0.38rem 0.6rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
  }
  .editor .hint {
    padding: 0.3rem 0.8rem 0.6rem;
    color: var(--muted);
    font-size: 0.78rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 720px) {
    body { padding: 1.25rem 1rem 3rem; }
    .filter-row select, .filter-row input[type="date"] { min-width: 100%; }
    .filter-row label { flex: 1 1 100%; }
    td.category-cell { min-width: 0; white-space: normal; }
  }
</style>
</head>
<body>
  <h1>Transactions</h1>

  <div id="tabs">
    <button type="button" id="tab-all" class="active">All transactions</button>
    <button type="button" id="tab-review">Review &amp; assign</button>
  </div>

  <div id="filters">
    <div class="filter-row">
      <label>
        Bank
        <select id="bank-filter">
          <option value="">All banks</option>
        </select>
      </label>
      <label>
        Card
        <select id="card-filter">
          <option value="">All cards</option>
        </select>
      </label>
    </div>
    <div class="filter-row">
      <label>
        Statement month
        <select id="statement-month-filter">
          <option value="">All months</option>
        </select>
      </label>
      <label>
        Start date
        <input type="date" id="start-filter">
      </label>
      <label>
        End date
        <input type="date" id="end-filter">
      </label>
      <label class="inline" id="uncategorized-only-label" style="display: none;">
        <input type="checkbox" id="uncategorized-only-filter" checked>
        Uncategorized only
      </label>
    </div>
  </div>

  <!-- All transactions -->
  <div id="panel-all">
    <div id="status">Loading…</div>
    <table id="transactions-table" style="display: none;">
      <thead>
        <tr>
          <th class="num">date</th>
          <th>description</th>
          <th class="type">type</th>
          <th class="num amount">amount</th>
        </tr>
      </thead>
      <tbody id="transactions-body"></tbody>
    </table>
  </div>

  <!-- Review & assign -->
  <div id="panel-review" style="display: none;">
    <div id="mode-bar" class="mode-bar">
      <span class="mode-label">Group by</span>
      <label class="mode-option">
        <input type="radio" name="review-mode" value="suggested" checked>
        suggested category
      </label>
      <label class="mode-option">
        <input type="radio" name="review-mode" value="similarity">
        similarity
      </label>
      <label class="mode-option threshold" id="threshold-label" style="display: none;">
        at least
        <input type="number" id="threshold-input" min="0" max="100" step="1" value="70">
        % similar
      </label>
    </div>
    <div id="review-status">Loading…</div>
    <div id="review-mode-note" class="mode-note" style="display: none;"></div>
    <div id="review-error" class="error" style="display: none;"></div>
    <div id="selection-bar" class="selection-bar" style="display: none;"></div>
    <div id="nothing-left" class="nothing-left" style="display: none;"></div>
    <table id="review-table" style="display: none;">
      <thead>
        <tr>
          <th class="select"></th>
          <th class="num">date</th>
          <th>description</th>
          <th class="type">type</th>
          <th class="num amount">amount</th>
          <th>category</th>
        </tr>
      </thead>
      <tbody id="review-body"></tbody>
    </table>
  </div>

  <script>
    // ------------------------------------------------------------------
    // Shared: filters, fetch helpers, URL state
    // ------------------------------------------------------------------
    const statusEl = document.getElementById("status");
    const tableEl = document.getElementById("transactions-table");
    const bodyEl = document.getElementById("transactions-body");
    const bankFilterEl = document.getElementById("bank-filter");
    const cardFilterEl = document.getElementById("card-filter");
    const statementMonthFilterEl = document.getElementById("statement-month-filter");
    const startFilterEl = document.getElementById("start-filter");
    const endFilterEl = document.getElementById("end-filter");
    const uncategorizedOnlyLabelEl = document.getElementById("uncategorized-only-label");
    const uncategorizedOnlyEl = document.getElementById("uncategorized-only-filter");

    const tabAllEl = document.getElementById("tab-all");
    const tabReviewEl = document.getElementById("tab-review");
    const panelAllEl = document.getElementById("panel-all");
    const panelReviewEl = document.getElementById("panel-review");

    const reviewStatusEl = document.getElementById("review-status");
    const reviewModeNoteEl = document.getElementById("review-mode-note");
    const modeRadios = Array.from(document.querySelectorAll('input[name="review-mode"]'));
    const thresholdLabelEl = document.getElementById("threshold-label");
    const thresholdInputEl = document.getElementById("threshold-input");
    const reviewErrorEl = document.getElementById("review-error");
    const selectionBarEl = document.getElementById("selection-bar");
    const nothingLeftEl = document.getElementById("nothing-left");
    const reviewTableEl = document.getElementById("review-table");
    const reviewBodyEl = document.getElementById("review-body");

    // Out-of-order guard: only the response from the most recently issued
    // load is allowed to render. Without this, a slow response to an
    // earlier filter change could land after (and overwrite) the result of
    // a newer one. One counter serves both tabs, since only the active tab
    // ever loads.
    let requestSeq = 0;

    let debounceTimer = null;
    const DEBOUNCE_MS = 300;

    let activeTab = "all";

    function extractErrorMessage(response) {
      return response
        .json()
        .then(
          (body) => (body && body.detail ? JSON.stringify(body.detail) : String(response.status)),
          () => String(response.status),
        );
    }

    function handleResponse(response) {
      if (!response.ok) {
        return extractErrorMessage(response).then((message) => {
          throw new Error(message);
        });
      }
      return response.json();
    }

    function fetchJSON(url) {
      return fetch(url).then(handleResponse);
    }

    function postJSON(url, body) {
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(handleResponse);
    }

    function currentFilters() {
      return {
        bank: bankFilterEl.value,
        cardId: cardFilterEl.value,
        statementMonth: statementMonthFilterEl.value,
        start: startFilterEl.value,
        end: endFilterEl.value,
      };
    }

    // Query params for a filter set. `omit` names filters to leave out --
    // that is how a picker's own options are computed "as if it were not
    // set", so a picker can never narrow itself out of the options it needs
    // to change its own value.
    function buildParams(filters, omit) {
      const skip = new Set(omit || []);
      const params = new URLSearchParams();
      if (filters.bank && !skip.has("bank")) params.set("bank", filters.bank);
      if (filters.cardId && !skip.has("cardId")) params.set("card_id", filters.cardId);
      if (filters.statementMonth && !skip.has("statementMonth")) {
        params.set("statement_month", filters.statementMonth);
      }
      if (filters.start && !skip.has("start")) params.set("start", filters.start);
      if (filters.end && !skip.has("end")) params.set("end", filters.end);
      return params;
    }

    function withParams(path, params) {
      const query = params.toString();
      return path + (query ? "?" + query : "");
    }

    function updateURL(filters) {
      // The API params, plus the two pieces of UI state that aren't API
      // filters (tab, uncategorized-only) so a reload lands where you were.
      const params = buildParams(filters);
      if (activeTab === "review") {
        params.set("tab", "review");
        if (!uncategorizedOnlyEl.checked) params.set("uncategorized", "0");
      }
      window.history.replaceState(null, "", withParams(window.location.pathname, params));
    }

    function transactionsURL(filters) {
      return withParams("/transactions", buildParams(filters));
    }

    // The date inputs' "options" are their min/max bounds: the earliest and
    // latest transaction dates given every filter *except* the dates. When
    // no date is set, the table's own result is exactly that set, so the
    // loaders pass it here for free; only when a date is set does
    // recomputeOptions() fetch the undated set separately.
    function applyDateBounds(transactions) {
      let min = "", max = "";
      for (const t of transactions) {
        if (!min || t.txn_date < min) min = t.txn_date;
        if (!max || t.txn_date > max) max = t.txn_date;
      }
      for (const el of [startFilterEl, endFilterEl]) {
        if (min) el.min = min; else el.removeAttribute("min");
        if (max) el.max = max; else el.removeAttribute("max");
        el.title = min ? "Data from " + min + " to " + max : "";
      }
    }

    function hasDateFilter(filters) {
      return Boolean(filters.start || filters.end);
    }

    // The stored txn_type is lowercase ("debit"/"credit"); it's shown
    // capitalised, as a small pill, in both tables.
    function displayType(txnType) {
      const t = String(txnType || "");
      return t.charAt(0).toUpperCase() + t.slice(1);
    }

    function typeCell(txn) {
      const cell = document.createElement("td");
      cell.className = "type";
      const pill = document.createElement("span");
      pill.className = "pill " + txn.txn_type;
      pill.textContent = displayType(txn.txn_type);
      cell.appendChild(pill);
      return cell;
    }

    // ------------------------------------------------------------------
    // Tab: All transactions
    // ------------------------------------------------------------------
    function renderTransactions(transactions) {
      bodyEl.textContent = "";

      if (transactions.length === 0) {
        statusEl.textContent = "No transactions found.";
        tableEl.style.display = "none";
        return;
      }

      for (const txn of transactions) {
        const row = document.createElement("tr");

        const dateCell = document.createElement("td");
        dateCell.className = "num";
        dateCell.textContent = txn.txn_date;
        row.appendChild(dateCell);

        const descriptionCell = document.createElement("td");
        descriptionCell.textContent = txn.description;
        row.appendChild(descriptionCell);

        row.appendChild(typeCell(txn));

        const amountCell = document.createElement("td");
        amountCell.className = "num amount " + txn.txn_type;
        amountCell.textContent = txn.amount;
        row.appendChild(amountCell);

        bodyEl.appendChild(row);
      }

      statusEl.textContent = "";
      tableEl.style.display = "";
    }

    function fetchTransactions(filters) {
      const seq = ++requestSeq;

      statusEl.textContent = "Loading…";
      tableEl.style.display = "none";

      fetchJSON(transactionsURL(filters))
        .then((transactions) => {
          if (seq !== requestSeq) return; // a newer request has since been issued
          if (!hasDateFilter(filters)) applyDateBounds(transactions);
          renderTransactions(transactions);
        })
        .catch((error) => {
          if (seq !== requestSeq) return;
          statusEl.textContent = "Error loading transactions: " + error.message;
        });
    }

    // ------------------------------------------------------------------
    // Tab: Review & assign
    // ------------------------------------------------------------------
    // All state for the review screen lives here. Every render reads from
    // it and rebuilds the DOM; every write goes to the API and then reloads
    // it, so what's on screen is always what the server has.
    const review = {
      transactions: [],
      suggestions: new Map(), // transaction_id -> {category, confidence, match_type}
      catalog: [],            // GET /categories, sorted
      selected: new Set(),    // manual multi-select, independent of groups
      query: "",              // selection-bar typeahead text
      editing: null,          // {id, groupIds, spread, adding} while a row's "change" is open
      busy: false,            // an assign call is in flight
      // Explicit collapse/expand choices this page session, by group key
      // (in-memory only). Absent key = the group's default: expanded, except
      // fully-categorized similarity clusters, which default to collapsed.
      collapseState: new Map(),
      mode: "suggested",      // "suggested" (default) or "similarity"; in-memory only
      threshold: 70,          // similarity mode: 0-100, percentage of the ratio
      clusters: [],           // similarity mode: [{anchor_id, members: [{transaction_id, similarity}]}]
      similarity: new Map(),  // similarity mode: transaction_id -> 0-100 score vs its cluster's anchor
    };

    function isOpen(txn) {
      return txn.category === null || txn.category === undefined;
    }

    function fmtAmount(n) {
      return "₹" + Number(n).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function txnLabel(n) {
      return n + (n === 1 ? " txn" : " txns");
    }

    // The suggestion the screen displays for a row, or null. Categorized
    // rows never show one (they are "done"); open rows show one only when
    // the engine found a match. Every accept on this screen writes exactly
    // this value -- the client-shown suggestion, never a recomputation.
    function suggestionFor(txn) {
      if (!isOpen(txn)) return null;
      const s = review.suggestions.get(txn.id);
      if (!s || s.match_type === "none") return null;
      return s;
    }

    function confClass(confidence) {
      return confidence >= 0.85 ? "high" : confidence >= 0.65 ? "mid" : "low";
    }

    function confText(s) {
      return s.match_type + " · " + Math.round(s.confidence * 100) + "%";
    }

    function buildGroups() {
      const open = review.transactions.filter(isOpen);
      const done = review.transactions.filter((t) => !isOpen(t));

      if (review.mode === "similarity") {
        // One group per cluster the endpoint returned, in its order, each
        // member in the order it was matched (anchor first). Rows in no
        // cluster are not shown at all in this mode -- renderReview's
        // mode note says how many, so they read as "below threshold", not
        // "missing". Category state is irrelevant to membership here.
        const byId = new Map(review.transactions.map((t) => [t.id, t]));
        review.similarity = new Map();
        const groups = [];
        for (const cluster of review.clusters) {
          const txns = [];
          for (const m of cluster.members) {
            const t = byId.get(m.transaction_id);
            if (!t) continue;
            txns.push(t);
            review.similarity.set(t.id, m.similarity);
          }
          if (txns.length < 2) continue;
          const anchor = byId.get(cluster.anchor_id) || txns[0];
          const group = makeGroup(
            "cluster",
            "Similar to \u201c" + anchor.description + "\u201d",
            txns,
            "cluster:" + cluster.anchor_id,
          );
          group.openCount = txns.filter(isOpen).length;
          // Fully-categorized clusters need no action: folded by default,
          // still openable. Anything with an open row stays expanded.
          group.defaultCollapsed = group.openCount === 0;
          groups.push(group);
        }
        // Groups needing action first; Array.prototype.sort is stable, so
        // the endpoint's order is kept within each of the two buckets.
        groups.sort((a, b) => Number(a.openCount === 0) - Number(b.openCount === 0));
        return { groups, openCount: open.length, doneCount: done.length };
      }

      const byCategory = new Map();
      const noSuggestion = [];
      for (const t of open) {
        const s = suggestionFor(t);
        if (!s) {
          noSuggestion.push(t);
          continue;
        }
        if (!byCategory.has(s.category)) byCategory.set(s.category, []);
        byCategory.get(s.category).push(t);
      }

      const groups = [];
      const suggested = Array.from(byCategory.entries()).sort(
        (a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]),
      );
      for (const [category, txns] of suggested) {
        groups.push(makeGroup("suggested", "Suggested: " + category, txns));
      }
      if (noSuggestion.length) {
        groups.push(makeGroup("none", "No suggestion", noSuggestion));
      }
      if (!uncategorizedOnlyEl.checked && done.length) {
        groups.push(makeGroup("done", "Already categorized", done));
      }
      return { groups, openCount: open.length, doneCount: done.length };
    }

    function makeGroup(kind, title, txns, key) {
      const ids = txns.map((t) => t.id);
      const total = txns.reduce((n, t) => n + Number(t.amount), 0);
      const methods = Array.from(
        new Set(txns.map((t) => suggestionFor(t)).filter(Boolean).map((s) => s.match_type)),
      );
      let meta = txnLabel(txns.length) + " · " + fmtAmount(total);
      if (kind === "done") {
        meta = txnLabel(txns.length) + " · select any of these to re-assign in bulk";
      } else if (kind === "cluster") {
        // A cluster has no single suggested category to accept, so no
        // methods line and (below) no accept-all; the per-row controls
        // still carry each row's own suggestion.
        const openCount = txns.filter(isOpen).length;
        meta += " · " + openCount + " uncategorized";
      } else if (methods.length) {
        meta += " · " + methods.join(" + ");
      } else {
        meta += " · assign manually";
      }
      return {
        kind,
        title,
        key: key || title,
        txns,
        ids,
        meta,
        canAccept: kind !== "cluster" && methods.length > 0,
      };
    }

    function isGroupCollapsed(group) {
      if (review.collapseState.has(group.key)) return review.collapseState.get(group.key);
      return group.defaultCollapsed === true;
    }

    function toggleGroupCollapsed(group) {
      review.collapseState.set(group.key, !isGroupCollapsed(group));
    }

    function visibleIds() {
      const { groups } = buildGroups();
      const ids = new Set();
      for (const g of groups) for (const id of g.ids) ids.add(id);
      return ids;
    }

    function pruneSelectionToVisible() {
      // In similarity mode the selection is kept for every row in the
      // filtered set, not just the rows above threshold: a threshold or
      // mode change must not change selection state (Session 51 brief).
      const shown =
        review.mode === "similarity"
          ? new Set(review.transactions.map((t) => t.id))
          : visibleIds();
      for (const id of Array.from(review.selected)) {
        if (!shown.has(id)) review.selected.delete(id);
      }
    }

    function setError(message) {
      if (message) {
        reviewErrorEl.textContent = message;
        reviewErrorEl.style.display = "";
      } else {
        reviewErrorEl.textContent = "";
        reviewErrorEl.style.display = "none";
      }
    }

    // One assign call, a list of {transaction_id, category} pairs. After a
    // successful write everything is re-fetched for the current filter, so
    // groups, the status line, and the catalog reflect the write.
    function assign(pairs) {
      if (review.busy || pairs.length === 0) return Promise.resolve();
      review.busy = true;
      setError("");
      return postJSON("/transactions/category", { assignments: pairs })
        .then(() => {
          for (const p of pairs) review.selected.delete(p.transaction_id);
          review.editing = null;
          review.query = "";
          // busy is cleared *before* the reload renders, otherwise every
          // button would be rebuilt disabled and stay that way.
          review.busy = false;
          return loadReview(currentFilters());
        })
        .catch((error) => {
          review.busy = false;
          setError("Error saving category: " + error.message);
        });
    }

    function acceptPairs(txns) {
      // Each row its own displayed suggestion; rows without one are skipped.
      const pairs = [];
      for (const t of txns) {
        const s = suggestionFor(t);
        if (s) pairs.push({ transaction_id: t.id, category: s.category });
      }
      return pairs;
    }

    function uniformPairs(ids, category) {
      return ids.map((id) => ({ transaction_id: id, category }));
    }

    // Every transaction in view -- categorized or not -- goes to the
    // clustering endpoint, in the table's own order (which is the anchor
    // order the endpoint honours). Empty input short-circuits to [].
    function fetchClusters(transactions) {
      const ids = transactions.map((t) => t.id);
      if (ids.length === 0) return Promise.resolve([]);
      return postJSON("/transactions/clusters", {
        transaction_ids: ids,
        threshold: review.threshold,
      }).then((body) => body.clusters);
    }

    // Threshold and mode changes re-cluster the transactions already
    // loaded rather than re-fetching everything. Own sequence counter: a
    // slow cluster response for an older threshold must not land after a
    // newer one, and this must not bump requestSeq (which would discard an
    // in-flight table load).
    let clusterSeq = 0;

    function reloadClusters() {
      const seq = ++clusterSeq;
      reviewModeNoteEl.textContent = "Grouping\u2026";
      reviewModeNoteEl.style.display = "";
      return fetchClusters(review.transactions)
        .then((clusters) => {
          if (seq !== clusterSeq) return;
          review.clusters = clusters;
          review.editing = null;
          renderReview();
        })
        .catch((error) => {
          if (seq !== clusterSeq) return;
          setError("Error grouping by similarity: " + error.message);
        });
    }

    function loadReview(filters) {
      const seq = ++requestSeq;
      reviewStatusEl.textContent = "Loading…";

      const transactionsP = fetchJSON(transactionsURL(filters));
      const catalogP = fetchJSON("/categories");
      const clustersP = transactionsP.then((transactions) =>
        review.mode === "similarity" ? fetchClusters(transactions) : review.clusters,
      );
      // Suggestions are only asked for open (uncategorized) rows: those are
      // the only ones the screen shows a suggestion for, and it's one batch
      // call however many there are.
      const suggestionsP = transactionsP.then((transactions) => {
        const openIds = transactions.filter(isOpen).map((t) => t.id);
        if (openIds.length === 0) return { suggestions: [] };
        return postJSON("/transactions/suggestions", { transaction_ids: openIds });
      });

      return Promise.all([transactionsP, suggestionsP, catalogP, clustersP])
        .then(([transactions, suggestionBody, catalog, clusters]) => {
          if (seq !== requestSeq) return;
          if (!hasDateFilter(filters)) applyDateBounds(transactions);
          review.transactions = transactions;
          review.suggestions = new Map(
            suggestionBody.suggestions.map((s) => [s.transaction_id, s]),
          );
          review.catalog = catalog;
          review.clusters = clusters;
          review.editing = null;
          // Selection survives a reload but only for rows still on screen.
          pruneSelectionToVisible();
          renderReview();
        })
        .catch((error) => {
          if (seq !== requestSeq) return;
          reviewStatusEl.textContent = "Error loading transactions: " + error.message;
          reviewTableEl.style.display = "none";
          selectionBarEl.style.display = "none";
          nothingLeftEl.style.display = "none";
        });
    }

    function renderReview() {
      const { groups, openCount, doneCount } = buildGroups();
      const total = review.transactions.length;

      reviewBodyEl.textContent = "";
      nothingLeftEl.style.display = "none";
      reviewModeNoteEl.style.display = "none";

      const similarity = review.mode === "similarity";
      thresholdLabelEl.style.display = similarity ? "" : "none";
      // "Uncategorized only" does not apply to similarity groups (every row
      // in view is clustered regardless of category state); it keeps its
      // value, so switching back restores exactly the previous view.
      uncategorizedOnlyEl.disabled = similarity;
      uncategorizedOnlyLabelEl.style.opacity = similarity ? "0.5" : "";

      if (total === 0) {
        reviewStatusEl.textContent = "No transactions found.";
        reviewTableEl.style.display = "none";
        selectionBarEl.style.display = "none";
        return;
      }

      reviewStatusEl.textContent =
        total + " transactions · " + openCount + " uncategorized · " + doneCount + " done";

      renderSelectionBar();

      if (similarity) {
        const shown = groups.reduce((n, g) => n + g.ids.length, 0);
        const hidden = total - shown;
        reviewModeNoteEl.textContent =
          shown + " of " + total + " shown" +
          (hidden > 0
            ? " \u2014 " + hidden + " with no match at " + review.threshold + "% or above"
            : "");
        reviewModeNoteEl.style.display = "";
        if (groups.length === 0) {
          nothingLeftEl.textContent =
            "No two descriptions are " + review.threshold + "% similar or more. " +
            "Lower the threshold to find looser matches.";
          nothingLeftEl.style.display = "";
        }
      } else if (openCount === 0) {
        nothingLeftEl.textContent = "Nothing left to review for these filters.";
        nothingLeftEl.style.display = "";
      }

      if (groups.length === 0) {
        reviewTableEl.style.display = "none";
        return;
      }

      for (const group of groups) {
        reviewBodyEl.appendChild(renderGroupHeader(group));
        // Collapsed groups keep their header (and its checkbox/accept-all);
        // only the rows are withheld. Keyed by title, which is the group's
        // identity across re-renders.
        if (isGroupCollapsed(group)) continue;
        for (const txn of group.txns) {
          reviewBodyEl.appendChild(renderRow(txn, group));
        }
      }
      reviewTableEl.style.display = "";

      // Focus whatever the open editor wants focused, now that it exists.
      if (review.editing) {
        const target = reviewBodyEl.querySelector("[data-autofocus]");
        if (target) target.focus();
      }
    }

    // --- selection bar -------------------------------------------------
    function renderSelectionBar() {
      selectionBarEl.textContent = "";
      const selectedTxns = review.transactions.filter((t) => review.selected.has(t.id));
      if (selectedTxns.length === 0) {
        selectionBarEl.style.display = "none";
        return;
      }
      const selectedIds = selectedTxns.map((t) => t.id);
      const amount = selectedTxns.reduce((n, t) => n + Number(t.amount), 0);
      const withSuggestion = acceptPairs(selectedTxns);

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = selectedIds.length + " selected · " + fmtAmount(amount);
      selectionBarEl.appendChild(label);

      // Typeahead: one typed category to every selected transaction.
      const typeahead = document.createElement("div");
      typeahead.className = "typeahead";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Assign category…";
      input.value = review.query;
      input.autocomplete = "off";
      const menu = document.createElement("div");
      menu.className = "menu";
      menu.style.display = "none";
      typeahead.appendChild(input);
      typeahead.appendChild(menu);

      const pick = (category) => assign(uniformPairs(selectedIds, category));
      const renderMenu = () => {
        menu.textContent = "";
        const q = review.query.trim();
        const qLower = q.toLowerCase();
        const matches = review.catalog
          .filter((c) => c.toLowerCase().includes(qLower))
          .slice(0, 6);
        const exact = review.catalog.some((c) => c.toLowerCase() === qLower);
        if (q && !exact) {
          const create = document.createElement("button");
          create.type = "button";
          create.className = "create";
          create.textContent = "+ create “" + q + "”";
          create.addEventListener("click", () => pick(q));
          menu.appendChild(create);
        }
        for (const c of matches) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = c;
          b.addEventListener("click", () => pick(c));
          menu.appendChild(b);
        }
        if (!menu.childNodes.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Type a category name";
          menu.appendChild(empty);
        }
        menu.style.display = "";
      };
      input.addEventListener("focus", renderMenu);
      input.addEventListener("input", () => {
        review.query = input.value;
        renderMenu();
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          const q = review.query.trim();
          if (!q) return;
          // Enter picks the exact catalog match if there is one (keeping its
          // casing), otherwise creates what was typed.
          const exact = review.catalog.find((c) => c.toLowerCase() === q.toLowerCase());
          pick(exact || q);
        } else if (event.key === "Escape") {
          menu.style.display = "none";
          input.blur();
        }
      });
      // Clicks inside the typeahead must not reach the document listener
      // that closes menus on outside click.
      typeahead.addEventListener("click", (event) => event.stopPropagation());
      selectionBarEl.appendChild(typeahead);

      const acceptBtn = document.createElement("button");
      acceptBtn.type = "button";
      acceptBtn.textContent = "Accept suggestions (" + withSuggestion.length + ")";
      acceptBtn.disabled = withSuggestion.length === 0 || review.busy;
      acceptBtn.title =
        "Writes each selected transaction its own suggested category; " +
        "selected rows with no suggestion are left as they are";
      acceptBtn.addEventListener("click", () => assign(withSuggestion));
      selectionBarEl.appendChild(acceptBtn);

      const clear = document.createElement("button");
      clear.type = "button";
      clear.className = "link";
      clear.textContent = "clear selection";
      clear.addEventListener("click", () => {
        review.selected.clear();
        review.query = "";
        renderReview();
      });
      selectionBarEl.appendChild(clear);

      selectionBarEl.style.display = "";
    }

    // --- group header --------------------------------------------------
    function renderGroupHeader(group) {
      const tr = document.createElement("tr");
      const isCollapsed = isGroupCollapsed(group);
      tr.className = "group" + (isCollapsed ? " collapsed" : "");
      const td = document.createElement("td");
      td.colSpan = 6;
      const head = document.createElement("div");
      head.className = "group-head";

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "toggle";
      toggle.setAttribute("aria-expanded", String(!isCollapsed));
      toggle.setAttribute("aria-label", (isCollapsed ? "Expand " : "Collapse ") + group.title);
      toggle.addEventListener("click", () => {
        toggleGroupCollapsed(group);
        renderReview();
      });
      head.appendChild(toggle);

      const allIn = group.ids.every((id) => review.selected.has(id));
      const someIn = !allIn && group.ids.some((id) => review.selected.has(id));
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = allIn;
      cb.indeterminate = someIn;
      cb.title = "Select every row in this group";
      cb.addEventListener("change", () => {
        if (allIn) for (const id of group.ids) review.selected.delete(id);
        else for (const id of group.ids) review.selected.add(id);
        renderReview();
      });
      head.appendChild(cb);

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = group.title;
      head.appendChild(title);

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = group.meta;
      head.appendChild(meta);

      const spacer = document.createElement("span");
      spacer.className = "spacer";
      head.appendChild(spacer);

      if (group.canAccept) {
        // One pair per row, each row's own displayed suggestion.
        const pairs = acceptPairs(group.txns);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "small";
        btn.textContent = "accept all " + pairs.length;
        btn.disabled = review.busy;
        btn.addEventListener("click", () => assign(pairs));
        head.appendChild(btn);
      }

      td.appendChild(head);
      tr.appendChild(td);
      return tr;
    }

    // --- row -------------------------------------------------------------
    function renderRow(txn, group) {
      const tr = document.createElement("tr");
      const isSelected = review.selected.has(txn.id);
      const isEditing = review.editing !== null && review.editing.id === txn.id;
      if (isEditing) tr.className = "editing";
      else if (isSelected) tr.className = "selected";

      const selectCell = document.createElement("td");
      selectCell.className = "select";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = isSelected;
      cb.addEventListener("change", () => {
        if (cb.checked) review.selected.add(txn.id);
        else review.selected.delete(txn.id);
        renderReview();
      });
      selectCell.appendChild(cb);
      tr.appendChild(selectCell);

      const dateCell = document.createElement("td");
      dateCell.className = "num";
      dateCell.textContent = txn.txn_date;
      tr.appendChild(dateCell);

      const descCell = document.createElement("td");
      descCell.textContent = txn.description;
      tr.appendChild(descCell);

      tr.appendChild(typeCell(txn));

      const amountCell = document.createElement("td");
      amountCell.className = "num amount " + txn.txn_type;
      amountCell.textContent = fmtAmount(txn.amount);
      tr.appendChild(amountCell);

      const catCell = document.createElement("td");
      catCell.className = "category-cell";
      const s = suggestionFor(txn);
      const hasCategory = !isOpen(txn);
      const inSimilarityMode = review.mode === "similarity";

      // Similarity mode shows two different numbers on a row -- how alike
      // this description is to the group's anchor, and (if any) the
      // suggestion engine's confidence -- so each carries its own label and
      // they can never be read as the same figure.
      if (inSimilarityMode && review.similarity.has(txn.id)) {
        const sim = document.createElement("span");
        sim.className = "badge similarity";
        sim.textContent = "similarity: " + Math.round(review.similarity.get(txn.id)) + "%";
        sim.title = "How closely this description matches the group\u2019s first row";
        catCell.appendChild(sim);
      }

      if (s) {
        if (inSimilarityMode) {
          const label = document.createElement("span");
          label.className = "badge-label";
          label.textContent = "suggestion:";
          catCell.appendChild(label);
        }
        const sug = document.createElement("span");
        sug.className = "sug";
        sug.textContent = s.category;
        catCell.appendChild(sug);
        const conf = document.createElement("span");
        conf.className = "conf " + confClass(s.confidence);
        conf.textContent = confText(s);
        catCell.appendChild(conf);
      } else if (hasCategory) {
        const cur = document.createElement("span");
        cur.textContent = txn.category;
        catCell.appendChild(cur);
      } else {
        const needs = document.createElement("span");
        needs.className = "needs";
        needs.textContent = "needs a category";
        catCell.appendChild(needs);
      }

      const actions = document.createElement("span");
      actions.className = "actions";
      if (s) {
        const accept = document.createElement("button");
        accept.type = "button";
        accept.className = "small";
        accept.textContent = "accept";
        accept.disabled = review.busy;
        // Exactly the displayed suggestion, as one pair.
        accept.addEventListener("click", () =>
          assign([{ transaction_id: txn.id, category: s.category }]),
        );
        actions.appendChild(accept);
      }
      const change = document.createElement("button");
      change.type = "button";
      change.className = "small";
      change.textContent = hasCategory || s ? "change" : "assign";
      change.disabled = review.busy;
      change.addEventListener("click", (event) => {
        event.stopPropagation(); // don't let the document listener close it at once
        review.editing = isEditing
          ? null
          : { id: txn.id, groupIds: group.ids.slice(), spread: false, adding: false };
        renderReview();
      });
      actions.appendChild(change);
      catCell.appendChild(actions);

      if (isEditing) catCell.appendChild(renderEditor(txn));

      tr.appendChild(catCell);
      return tr;
    }

    // --- per-row "change" dropdown ---------------------------------------
    function renderEditor(txn) {
      const state = review.editing;
      const editor = document.createElement("div");
      editor.className = "editor";
      editor.addEventListener("click", (event) => event.stopPropagation());
      editor.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          review.editing = null;
          renderReview();
        }
      });

      // The group's full id list was captured when the editor opened, so
      // "spread" applies to every transaction currently in that group.
      const others = state.groupIds.filter((id) => id !== txn.id);
      const targets = () => (state.spread && others.length ? state.groupIds : [txn.id]);
      const pick = (category) => assign(uniformPairs(targets(), category));

      // "spread to group" -- only when there is a group to spread to.
      if (others.length > 0) {
        const spread = document.createElement("label");
        spread.className = "spread";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = state.spread;
        cb.addEventListener("change", () => {
          state.spread = cb.checked;
        });
        spread.appendChild(cb);
        spread.appendChild(
          document.createTextNode("also apply to the other " + others.length + " in this group"),
        );
        editor.appendChild(spread);
      }

      if (!state.adding) {
        const list = document.createElement("div");
        list.className = "list";
        if (review.catalog.length === 0) {
          const empty = document.createElement("div");
          empty.className = "hint";
          empty.textContent = "No categories yet";
          list.appendChild(empty);
        }
        review.catalog.forEach((c, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = c;
          if (i === 0) b.dataset.autofocus = "1";
          b.addEventListener("click", () => pick(c)); // picking saves immediately
          list.appendChild(b);
        });
        editor.appendChild(list);

        const addNew = document.createElement("button");
        addNew.type = "button";
        addNew.className = "add-new";
        addNew.textContent = "add new category";
        if (review.catalog.length === 0) addNew.dataset.autofocus = "1";
        addNew.addEventListener("click", () => {
          state.adding = true;
          renderReview();
        });
        editor.appendChild(addNew);
      } else {
        const wrap = document.createElement("div");
        wrap.className = "new-input";
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "New category";
        input.autocomplete = "off";
        input.dataset.autofocus = "1";
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            const value = input.value.trim();
            if (value) pick(value);
          }
          // Escape bubbles to the editor's handler above.
        });
        wrap.appendChild(input);
        editor.appendChild(wrap);

        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = "⏎ saves · esc cancels";
        editor.appendChild(hint);
      }

      return editor;
    }

    // Clicking anywhere outside an open editor or typeahead menu closes it.
    document.addEventListener("click", () => {
      for (const menu of document.querySelectorAll(".menu")) {
        menu.style.display = "none";
      }
      if (review.editing !== null) {
        review.editing = null;
        renderReview();
      }
    });

    // ------------------------------------------------------------------
    // Tabs
    // ------------------------------------------------------------------
    function setTab(tab, load) {
      activeTab = tab;
      const isReview = tab === "review";
      tabAllEl.classList.toggle("active", !isReview);
      tabReviewEl.classList.toggle("active", isReview);
      panelAllEl.style.display = isReview ? "none" : "";
      panelReviewEl.style.display = isReview ? "" : "none";
      uncategorizedOnlyLabelEl.style.display = isReview ? "" : "none";
      if (load) {
        // Filters didn't change, so the pickers' options don't need
        // recomputing -- only the table for the newly active tab.
        const filters = currentFilters();
        updateURL(filters);
        loadActiveTab(filters);
      }
    }

    function loadActiveTab(filters) {
      if (activeTab === "review") loadReview(filters);
      else fetchTransactions(filters);
    }

    // ------------------------------------------------------------------
    // Filter pickers + initial load
    // ------------------------------------------------------------------
    function cardLabel(card) {
      return card.nickname ? card.card_type + " \u2014 " + card.nickname : card.card_type;
    }

    // Rebuild a <select>'s options, keeping its current value selected. If
    // the current value is no longer among the narrowed options it is kept
    // -- flagged, not silently cleared -- so the user sees why the table is
    // empty and can change it themselves; nothing changes filter state
    // behind their back.
    function setOptions(select, allLabel, options, current, emptyLabel) {
      select.textContent = "";
      const all = document.createElement("option");
      all.value = "";
      all.textContent = options.length || !emptyLabel ? allLabel : emptyLabel;
      select.appendChild(all);
      let seen = false;
      for (const o of options) {
        const option = document.createElement("option");
        option.value = o.value;
        option.textContent = o.label;
        if (o.value === current) seen = true;
        select.appendChild(option);
      }
      if (current && !seen) {
        const stale = document.createElement("option");
        stale.value = current;
        stale.textContent = current + " (no matching data)";
        select.appendChild(stale);
      }
      select.value = current;
    }

    // Every card the page has seen, by id, from whichever /cards response
    // came last -- so a picked card's bank can be looked up without another
    // request. Under "All banks" the list spans every bank.
    const cardsById = new Map();

    function rememberCards(cards) {
      for (const c of cards) cardsById.set(String(c.id), c);
    }

    // The one rule for Bank vs Card disagreement, used on URL load and on a
    // live card pick alike: a card belongs to exactly one bank, so the
    // card's bank wins whenever the two differ -- including when Bank is
    // "All banks". Session 48.
    function resolveBank(bank, card) {
      return card && card.bank !== bank ? card.bank : bank;
    }

    // Out-of-order guard for the option fetches, separate from the table's
    // requestSeq: both run on every filter change, and a slow options
    // response for an older filter set must not repopulate the pickers
    // after a newer one has.
    let optionsSeq = 0;

    // Bidirectional narrowing: every picker's options are recomputed from
    // the listing endpoints with every filter applied except the picker's
    // own. Card is subordinate to Bank, so Bank's options also leave Card
    // out (otherwise choosing a card would pin the bank list to one entry
    // and the user could never switch banks without clearing the card).
    function recomputeOptions(filters) {
      const seq = ++optionsSeq;

      const banksP = fetchJSON(
        withParams("/card-types", buildParams(filters, ["bank", "cardId"])),
      );
      // "All banks" is a bank selection like any other for Card's purposes:
      // it narrows Card's options (to every card with data under the other
      // filters) rather than locking the picker. Session 47.
      const cardsP = fetchJSON(withParams("/cards", buildParams(filters, ["cardId"])));
      const monthsP = fetchJSON(
        withParams("/statement-months", buildParams(filters, ["statementMonth"])),
      );
      const boundsP = hasDateFilter(filters)
        ? fetchJSON(withParams("/transactions", buildParams(filters, ["start", "end"])))
        : Promise.resolve(null);

      return Promise.all([banksP, cardsP, monthsP, boundsP])
        .then(([cardTypes, cards, months, undated]) => {
          if (seq !== optionsSeq) return; // a newer filter set has since been issued
          rememberCards(cards);
          const banks = Array.from(new Set(cardTypes.map((p) => p.bank)));
          setOptions(
            bankFilterEl,
            "All banks",
            banks.map((b) => ({ value: b, label: b })),
            filters.bank,
            "No banks with data",
          );
          setOptions(
            cardFilterEl,
            "All cards",
            cards.map((c) => ({ value: String(c.id), label: cardLabel(c) })),
            filters.cardId,
            "No cards with data",
          );
          setOptions(
            statementMonthFilterEl,
            "All months",
            months.map((m) => ({ value: m, label: m })),
            filters.statementMonth,
            "No statement months",
          );
          if (undated !== null) applyDateBounds(undated);
        })
        .catch(() => {
          // Options are a convenience layer over the table; a failed
          // options fetch leaves the pickers as they were, and the table's
          // own error path reports the problem.
        });
    }

    // On load the URL is the source of truth. Card and month are validated
    // against the *unfiltered* lists so a stale or hand-typed value falls
    // back to "all" rather than sticking as an invisible filter; the bank
    // is taken from the card when a card is given (the card wins), else
    // from the URL.
    function initFromURL() {
      const params = new URLSearchParams(window.location.search);
      const urlBank = params.get("bank") || "";
      const urlCardId = params.get("card_id") || "";
      const urlStatementMonth = params.get("statement_month") || "";
      const urlStart = params.get("start") || "";
      const urlEnd = params.get("end") || "";
      const urlTab = params.get("tab") === "review" ? "review" : "all";
      uncategorizedOnlyEl.checked = params.get("uncategorized") !== "0";

      startFilterEl.value = urlStart;
      endFilterEl.value = urlEnd;
      setTab(urlTab, false);

      statusEl.textContent = "Loading…";
      reviewStatusEl.textContent = "Loading…";

      Promise.all([fetchJSON("/cards"), fetchJSON("/statement-months")])
        .then(([cards, statementMonths]) => {
          const card = cards.find((c) => String(c.id) === urlCardId);
          const knownBanks = new Set(cards.map((c) => c.bank));
          rememberCards(cards);
          // Same rule as a live card pick (resolveBank): the card's bank
          // wins whenever it differs from the URL's bank, "All banks"
          // included -- so a reload lands where a live pick would have.
          const bank = resolveBank(knownBanks.has(urlBank) ? urlBank : "", card);
          const filters = {
            bank,
            cardId: card ? String(card.id) : "",
            statementMonth: statementMonths.includes(urlStatementMonth) ? urlStatementMonth : "",
            start: urlStart,
            end: urlEnd,
          };
          // Seed the selects with the resolved values so currentFilters()
          // reads them back; recomputeOptions() then fills in the options.
          setOptions(bankFilterEl, "All banks", bank ? [{ value: bank, label: bank }] : [], bank);
          setOptions(
            cardFilterEl,
            "All cards",
            card ? [{ value: String(card.id), label: cardLabel(card) }] : [],
            filters.cardId,
          );
          setOptions(
            statementMonthFilterEl,
            "All months",
            filters.statementMonth
              ? [{ value: filters.statementMonth, label: filters.statementMonth }]
              : [],
            filters.statementMonth,
          );
          updateURL(filters);
          recomputeOptions(filters);
          loadActiveTab(filters);
        })
        .catch((error) => {
          statusEl.textContent = "Error loading transactions: " + error.message;
          reviewStatusEl.textContent = "Error loading transactions: " + error.message;
        });
    }

    function onFilterChange() {
      const filters = currentFilters();
      updateURL(filters);
      recomputeOptions(filters);
      loadActiveTab(filters);
    }

    function onCardChange() {
      // Picking a card whose bank differs from Bank (typically: Bank is
      // "All banks") sets Bank to that card's bank, then goes through the
      // ordinary filter-change path -- the same URL update, options
      // recompute, and table load a manual bank pick would trigger. It does
      // NOT go through onBankChange, which resets Card: the just-picked
      // card is the whole point. Card keeps its value; recomputeOptions
      // then re-lists the cards scoped to the new bank, which include it.
      const card = cardsById.get(cardFilterEl.value);
      const bank = resolveBank(bankFilterEl.value, card);
      if (bank !== bankFilterEl.value) {
        // Make sure the option exists before selecting it; the next
        // recompute rebuilds the list properly.
        if (!Array.from(bankFilterEl.options).some((o) => o.value === bank)) {
          const option = document.createElement("option");
          option.value = bank;
          option.textContent = bank;
          bankFilterEl.appendChild(option);
        }
        bankFilterEl.value = bank;
      }
      onFilterChange();
    }

    function onBankChange() {
      // Card is a child of Bank: a new bank always means "all cards" of it.
      cardFilterEl.value = "";
      onFilterChange();
    }

    function onDateInput() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(onFilterChange, DEBOUNCE_MS);
    }

    bankFilterEl.addEventListener("change", onBankChange);
    cardFilterEl.addEventListener("change", onCardChange);
    statementMonthFilterEl.addEventListener("change", onFilterChange);
    startFilterEl.addEventListener("input", onDateInput);
    endFilterEl.addEventListener("input", onDateInput);
    // "Uncategorized only" is a view toggle, not an API filter: the data is
    // already loaded, so it only re-groups. The URL is updated so a reload
    // keeps it.
    uncategorizedOnlyEl.addEventListener("change", () => {
      updateURL(currentFilters());
      pruneSelectionToVisible();
      review.editing = null;
      renderReview();
    });
    // Grouping mode: switching changes only how rows are grouped (and, in
    // similarity mode, which are shown) -- filters and selection are left
    // alone. Into similarity: cluster what is already loaded. Back to
    // suggested: the full reload the screen always did, suggestions
    // included, which shows every filtered row again.
    for (const radio of modeRadios) {
      radio.addEventListener("change", () => {
        if (!radio.checked) return;
        review.mode = radio.value;
        review.editing = null;
        if (review.mode === "similarity") {
          renderReview(); // show the threshold input and note straight away
          reloadClusters();
        } else {
          loadReview(currentFilters());
        }
      });
    }

    let thresholdTimer = null;
    thresholdInputEl.addEventListener("input", () => {
      clearTimeout(thresholdTimer);
      thresholdTimer = setTimeout(() => {
        const raw = Number(thresholdInputEl.value);
        if (!Number.isFinite(raw)) return;
        const value = Math.min(100, Math.max(0, Math.round(raw)));
        if (String(value) !== thresholdInputEl.value) thresholdInputEl.value = String(value);
        if (value === review.threshold) return;
        review.threshold = value;
        if (review.mode === "similarity") reloadClusters();
      }, DEBOUNCE_MS);
    });

    tabAllEl.addEventListener("click", () => setTab("all", true));
    tabReviewEl.addEventListener("click", () => setTab("review", true));

    initFromURL();
  </script>
</body>
</html>
