<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transactions</title>
<style>
  body {
    font-family: sans-serif;
    margin: 2rem;
  }
  #filters {
    margin-bottom: 1.5rem;
  }
  .filter-row {
    display: flex;
    gap: 1.5rem;
    align-items: flex-end;
    margin-bottom: 1rem;
  }
  .filter-row label {
    display: flex;
    flex-direction: column;
    font-size: 0.85rem;
    gap: 0.25rem;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th, td {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid #ccc;
  }
  th {
    background-color: #eee;
    font-weight: bold;
  }
  #status {
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <h1>Transactions</h1>

  <div id="filters">
    <div class="filter-row">
      <label>
        Card
        <select id="card-filter">
          <option value="">All cards</option>
        </select>
      </label>
      <label>
        Bank / card type
        <select id="bank-card-type-filter">
          <option value="">All banks &amp; card types</option>
        </select>
      </label>
    </div>
    <div class="filter-row">
      <label>
        Statement month
        <select id="statement-month-filter">
          <option value="">All months</option>
        </select>
      </label>
      <label>
        Start date
        <input type="date" id="start-filter">
      </label>
      <label>
        End date
        <input type="date" id="end-filter">
      </label>
    </div>
  </div>

  <div id="status">Loading…</div>
  <table id="transactions-table" style="display: none;">
    <thead>
      <tr>
        <th>date</th>
        <th>amount</th>
        <th>type</th>
        <th>description</th>
      </tr>
    </thead>
    <tbody id="transactions-body"></tbody>
  </table>

  <script>
    const statusEl = document.getElementById("status");
    const tableEl = document.getElementById("transactions-table");
    const bodyEl = document.getElementById("transactions-body");
    const cardFilterEl = document.getElementById("card-filter");
    const bankCardTypeFilterEl = document.getElementById("bank-card-type-filter");
    const statementMonthFilterEl = document.getElementById("statement-month-filter");
    const startFilterEl = document.getElementById("start-filter");
    const endFilterEl = document.getElementById("end-filter");

    // Out-of-order guard: only the response from the most recently issued
    // /transactions request is allowed to render. Without this, a slow
    // response to an earlier filter change could land after (and overwrite)
    // the result of a newer one.
    let requestSeq = 0;

    let debounceTimer = null;
    const DEBOUNCE_MS = 300;

    function extractErrorMessage(response) {
      return response
        .json()
        .then(
          (body) => (body && body.detail ? body.detail : String(response.status)),
          () => String(response.status),
        );
    }

    function fetchJSON(url) {
      return fetch(url).then((response) => {
        if (!response.ok) {
          return extractErrorMessage(response).then((message) => {
            throw new Error(message);
          });
        }
        return response.json();
      });
    }

    function currentBankCardType() {
      if (!bankCardTypeFilterEl.value) return { bank: "", cardType: "" };
      const parsed = JSON.parse(bankCardTypeFilterEl.value);
      return { bank: parsed.bank, cardType: parsed.card_type };
    }

    function currentFilters() {
      const { bank, cardType } = currentBankCardType();
      return {
        cardId: cardFilterEl.value,
        statementMonth: statementMonthFilterEl.value,
        bank,
        cardType,
        start: startFilterEl.value,
        end: endFilterEl.value,
      };
    }

    function buildParams(filters) {
      const params = new URLSearchParams();
      if (filters.cardId) params.set("card_id", filters.cardId);
      if (filters.statementMonth) params.set("statement_month", filters.statementMonth);
      if (filters.bank) params.set("bank", filters.bank);
      if (filters.cardType) params.set("card_type", filters.cardType);
      if (filters.start) params.set("start", filters.start);
      if (filters.end) params.set("end", filters.end);
      return params;
    }

    function updateURL(filters) {
      const query = buildParams(filters).toString();
      const newURL = window.location.pathname + (query ? "?" + query : "");
      window.history.replaceState(null, "", newURL);
    }

    function renderTransactions(transactions) {
      bodyEl.textContent = "";

      if (transactions.length === 0) {
        statusEl.textContent = "No transactions found.";
        tableEl.style.display = "none";
        return;
      }

      for (const txn of transactions) {
        const row = document.createElement("tr");

        const dateCell = document.createElement("td");
        dateCell.textContent = txn.txn_date;
        row.appendChild(dateCell);

        const amountCell = document.createElement("td");
        amountCell.textContent = txn.amount;
        row.appendChild(amountCell);

        const typeCell = document.createElement("td");
        typeCell.textContent = txn.txn_type;
        row.appendChild(typeCell);

        const descriptionCell = document.createElement("td");
        descriptionCell.textContent = txn.description;
        row.appendChild(descriptionCell);

        bodyEl.appendChild(row);
      }

      statusEl.textContent = "";
      tableEl.style.display = "";
    }

    function fetchTransactions(filters) {
      const seq = ++requestSeq;

      statusEl.textContent = "Loading…";
      tableEl.style.display = "none";

      const query = buildParams(filters).toString();

      fetchJSON("/transactions" + (query ? "?" + query : ""))
        .then((transactions) => {
          if (seq !== requestSeq) return; // a newer request has since been issued
          renderTransactions(transactions);
        })
        .catch((error) => {
          if (seq !== requestSeq) return;
          statusEl.textContent = "Error loading transactions: " + error.message;
        });
    }

    function populateCardPicker(cards) {
      if (cards.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No cards with statements yet";
        option.disabled = true;
        option.selected = true;
        cardFilterEl.appendChild(option);
        return;
      }

      for (const card of cards) {
        const option = document.createElement("option");
        option.value = String(card.id);
        option.textContent =
          card.bank + " " + card.card_type + (card.nickname ? " (" + card.nickname + ")" : "");
        cardFilterEl.appendChild(option);
      }
    }

    function populateStatementMonthPicker(statementMonths) {
      if (statementMonths.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No statement months yet";
        option.disabled = true;
        option.selected = true;
        statementMonthFilterEl.appendChild(option);
        return;
      }

      for (const month of statementMonths) {
        const option = document.createElement("option");
        option.value = month;
        option.textContent = month;
        statementMonthFilterEl.appendChild(option);
      }
    }

    function populateBankCardTypePicker(cardTypes) {
      if (cardTypes.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No banks/card types yet";
        option.disabled = true;
        option.selected = true;
        bankCardTypeFilterEl.appendChild(option);
        return;
      }

      for (const pair of cardTypes) {
        const option = document.createElement("option");
        option.value = JSON.stringify({ bank: pair.bank, card_type: pair.card_type });
        option.textContent = pair.bank + " " + pair.card_type;
        bankCardTypeFilterEl.appendChild(option);
      }
    }

    function fetchFiltersThenTransactions() {
      const params = new URLSearchParams(window.location.search);
      const urlCardId = params.get("card_id") || "";
      const urlStatementMonth = params.get("statement_month") || "";
      const urlBank = params.get("bank") || "";
      const urlCardType = params.get("card_type") || "";
      const urlStart = params.get("start") || "";
      const urlEnd = params.get("end") || "";

      startFilterEl.value = urlStart;
      endFilterEl.value = urlEnd;

      statusEl.textContent = "Loading…";

      // /cards, /statement-months, and /card-types are independent of each
      // other, so they're fetched together -- but all three must resolve
      // before /transactions is fetched, since hydrating filter values from
      // the URL requires validating them against these three lists first.
      Promise.all([
        fetchJSON("/cards"),
        fetchJSON("/statement-months"),
        fetchJSON("/card-types"),
      ])
        .then(([cards, statementMonths, cardTypes]) => {
          populateCardPicker(cards);
          populateStatementMonthPicker(statementMonths);
          populateBankCardTypePicker(cardTypes);

          const knownCardIds = new Set(cards.map((card) => String(card.id)));
          const resolvedCardId = knownCardIds.has(urlCardId) ? urlCardId : "";
          cardFilterEl.value = resolvedCardId;

          const knownMonths = new Set(statementMonths);
          const resolvedStatementMonth = knownMonths.has(urlStatementMonth)
            ? urlStatementMonth
            : "";
          statementMonthFilterEl.value = resolvedStatementMonth;

          const matchingPair =
            urlBank && urlCardType
              ? cardTypes.find(
                  (pair) => pair.bank === urlBank && pair.card_type === urlCardType,
                )
              : undefined;
          bankCardTypeFilterEl.value = matchingPair
            ? JSON.stringify({ bank: matchingPair.bank, card_type: matchingPair.card_type })
            : "";

          const filters = {
            cardId: resolvedCardId,
            statementMonth: resolvedStatementMonth,
            bank: matchingPair ? matchingPair.bank : "",
            cardType: matchingPair ? matchingPair.card_type : "",
            start: urlStart,
            end: urlEnd,
          };
          updateURL(filters);
          fetchTransactions(filters);
        })
        .catch((error) => {
          statusEl.textContent = "Error loading transactions: " + error.message;
        });
    }

    function onFilterChange() {
      const filters = currentFilters();
      updateURL(filters);
      fetchTransactions(filters);
    }

    function onDateInput() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(onFilterChange, DEBOUNCE_MS);
    }

    cardFilterEl.addEventListener("change", onFilterChange);
    bankCardTypeFilterEl.addEventListener("change", onFilterChange);
    statementMonthFilterEl.addEventListener("change", onFilterChange);
    startFilterEl.addEventListener("input", onDateInput);
    endFilterEl.addEventListener("input", onDateInput);

    fetchFiltersThenTransactions();
  </script>
</body>
</html>
