<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transactions</title>
<style>
  body {
    font-family: sans-serif;
    margin: 2rem;
  }
  #filters {
    display: flex;
    gap: 1.5rem;
    align-items: flex-end;
    margin-bottom: 1.5rem;
  }
  #filters label {
    display: flex;
    flex-direction: column;
    font-size: 0.85rem;
    gap: 0.25rem;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th, td {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid #ccc;
  }
  th {
    background-color: #eee;
    font-weight: bold;
  }
  #status {
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <h1>Transactions</h1>

  <div id="filters">
    <label>
      Card
      <select id="card-filter">
        <option value="">All cards</option>
      </select>
    </label>
    <label>
      Start date
      <input type="date" id="start-filter">
    </label>
    <label>
      End date
      <input type="date" id="end-filter">
    </label>
  </div>

  <div id="status">Loading…</div>
  <table id="transactions-table" style="display: none;">
    <thead>
      <tr>
        <th>date</th>
        <th>amount</th>
        <th>type</th>
        <th>description</th>
      </tr>
    </thead>
    <tbody id="transactions-body"></tbody>
  </table>

  <script>
    const statusEl = document.getElementById("status");
    const tableEl = document.getElementById("transactions-table");
    const bodyEl = document.getElementById("transactions-body");
    const cardFilterEl = document.getElementById("card-filter");
    const startFilterEl = document.getElementById("start-filter");
    const endFilterEl = document.getElementById("end-filter");

    // Out-of-order guard: only the response from the most recently issued
    // /transactions request is allowed to render. Without this, a slow
    // response to an earlier filter change could land after (and overwrite)
    // the result of a newer one.
    let requestSeq = 0;

    let debounceTimer = null;
    const DEBOUNCE_MS = 300;

    function currentFilters() {
      return {
        cardId: cardFilterEl.value,
        start: startFilterEl.value,
        end: endFilterEl.value,
      };
    }

    function updateURL(filters) {
      const params = new URLSearchParams();
      if (filters.cardId) params.set("card_id", filters.cardId);
      if (filters.start) params.set("start", filters.start);
      if (filters.end) params.set("end", filters.end);

      const query = params.toString();
      const newURL = window.location.pathname + (query ? "?" + query : "");
      window.history.replaceState(null, "", newURL);
    }

    function extractErrorMessage(response) {
      return response
        .json()
        .then(
          (body) => (body && body.detail ? body.detail : String(response.status)),
          () => String(response.status),
        );
    }

    function renderTransactions(transactions) {
      bodyEl.textContent = "";

      if (transactions.length === 0) {
        statusEl.textContent = "No transactions found.";
        tableEl.style.display = "none";
        return;
      }

      for (const txn of transactions) {
        const row = document.createElement("tr");

        const dateCell = document.createElement("td");
        dateCell.textContent = txn.txn_date;
        row.appendChild(dateCell);

        const amountCell = document.createElement("td");
        amountCell.textContent = txn.amount;
        row.appendChild(amountCell);

        const typeCell = document.createElement("td");
        typeCell.textContent = txn.txn_type;
        row.appendChild(typeCell);

        const descriptionCell = document.createElement("td");
        descriptionCell.textContent = txn.description;
        row.appendChild(descriptionCell);

        bodyEl.appendChild(row);
      }

      statusEl.textContent = "";
      tableEl.style.display = "";
    }

    function fetchTransactions(filters) {
      const seq = ++requestSeq;

      statusEl.textContent = "Loading…";
      tableEl.style.display = "none";

      const params = new URLSearchParams();
      if (filters.cardId) params.set("card_id", filters.cardId);
      if (filters.start) params.set("start", filters.start);
      if (filters.end) params.set("end", filters.end);
      const query = params.toString();

      fetch("/transactions" + (query ? "?" + query : ""))
        .then((response) => {
          if (!response.ok) {
            return extractErrorMessage(response).then((message) => {
              throw new Error(message);
            });
          }
          return response.json();
        })
        .then((transactions) => {
          if (seq !== requestSeq) return; // a newer request has since been issued
          renderTransactions(transactions);
        })
        .catch((error) => {
          if (seq !== requestSeq) return;
          statusEl.textContent = "Error loading transactions: " + error.message;
        });
    }

    function fetchFiltersThenTransactions() {
      const params = new URLSearchParams(window.location.search);
      const urlCardId = params.get("card_id") || "";
      const urlStart = params.get("start") || "";
      const urlEnd = params.get("end") || "";

      startFilterEl.value = urlStart;
      endFilterEl.value = urlEnd;

      statusEl.textContent = "Loading…";

      fetch("/cards")
        .then((response) => {
          if (!response.ok) {
            return extractErrorMessage(response).then((message) => {
              throw new Error(message);
            });
          }
          return response.json();
        })
        .then((cards) => {
          if (cards.length === 0) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "No cards with statements yet";
            option.disabled = true;
            option.selected = true;
            cardFilterEl.appendChild(option);
          } else {
            for (const card of cards) {
              const option = document.createElement("option");
              option.value = String(card.id);
              option.textContent =
                card.bank + " " + card.card_type + (card.nickname ? " (" + card.nickname + ")" : "");
              cardFilterEl.appendChild(option);
            }
          }

          const knownCardIds = new Set(cards.map((card) => String(card.id)));
          const resolvedCardId = knownCardIds.has(urlCardId) ? urlCardId : "";
          cardFilterEl.value = resolvedCardId;

          const filters = { cardId: resolvedCardId, start: urlStart, end: urlEnd };
          updateURL(filters);
          fetchTransactions(filters);
        })
        .catch((error) => {
          statusEl.textContent = "Error loading transactions: " + error.message;
        });
    }

    cardFilterEl.addEventListener("change", () => {
      const filters = currentFilters();
      updateURL(filters);
      fetchTransactions(filters);
    });

    function onDateInput() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const filters = currentFilters();
        updateURL(filters);
        fetchTransactions(filters);
      }, DEBOUNCE_MS);
    }

    startFilterEl.addEventListener("input", onDateInput);
    endFilterEl.addEventListener("input", onDateInput);

    fetchFiltersThenTransactions();
  </script>
</body>
</html>
