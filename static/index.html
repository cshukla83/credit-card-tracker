        const cur = document.createElement("span");
        cur.className = "saved";
        cur.textContent = saved;
        cell.appendChild(cur);
      } else if (s) {
        // Ghost suggestion: one click accepts exactly the displayed value.
        const ghost = document.createElement("button");
        ghost.type = "button";
        ghost.className = "ghost";
        ghost.textContent = s.value;
        ghost.title = "Click to accept this suggestion";
        ghost.disabled = review.busy;
        ghost.addEventListener("click", (event) => {
          event.stopPropagation();
          review.editing = null;
          assign(spec.pairs([txn.id], s.value));
        });
        cell.appendChild(ghost);
        const badge = document.createElement("span");
        if (spec.fallbackType && s.match_type === spec.fallbackType) {
          badge.className = "conf default";
          badge.textContent = spec.fallbackWords;
        } else {
          badge.className = "conf " + confClass(s.confidence);
          badge.textContent = confText(s);
        }
        cell.appendChild(badge);
      } else {
        const none = document.createElement("span");
        none.className = "unset";
        none.textContent = "\u2014";
        if (field === "subcategory" && isOpen(txn)) {
          none.title = "Set a category first to get a subcategory suggestion";
        }
        cell.appendChild(none);
      }

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "edit-icon";
      edit.setAttribute("aria-label", "Edit " + spec.label);
      edit.title = "Edit " + spec.label;
      edit.textContent = "\u270e";
      edit.disabled = review.busy;
      edit.addEventListener("click", (event) => {
        event.stopPropagation();
        review.editing = { id: txn.id, field };
        renderReview();
      });
      cell.appendChild(edit);
      return cell;
    }

    // The combo editor: an input pre-filled with the saved value, else the
    // suggestion text (so accept-with-a-tweak needs no retyping), else
    // empty; a typeahead menu of the column's existing values. Picking an
    // option saves at once; typed text saves on Enter (a new value is just
    // a value not in the list); Escape, blur, or tabbing away cancels and
    // nothing is saved.
    function renderInlineEditor(txn, field, saved, suggestion) {
      const spec = LABEL_FIELDS[field];
      const wrap = document.createElement("span");
      wrap.className = "inline-editor";
      wrap.addEventListener("click", (event) => event.stopPropagation());

      const targets = saveTargets(txn);
      if (targets.length > 1) {
        // Unambiguous before commit: say how many rows, and the selected
        // rows are already highlighted by their .selected class.
        const note = document.createElement("span");
        note.className = "bulk-note";
        note.textContent = "Applies to " + targets.length + " selected rows";
        wrap.appendChild(note);
      }

      const input = document.createElement("input");
      input.type = "text";
      input.className = "inline-input";
      input.autocomplete = "off";
      input.value = saved !== null ? saved : suggestion ? suggestion.value : "";
      input.dataset.autofocus = "1";
      input.setAttribute("aria-label", "Edit " + spec.label);
      wrap.appendChild(input);

      const menu = document.createElement("div");
      menu.className = "menu inline-menu";
      wrap.appendChild(menu);

      let committed = false; // set when a pick or Enter has saved
      const commit = (value) => {
        committed = true;
        saveLabel(txn, field, value);
      };
      const cancel = () => {
        if (committed) return;
        if (review.editing && review.editing.id === txn.id && review.editing.field === field) {
          review.editing = null;
          renderReview();
        }
      };

      const renderMenu = () => {
        menu.textContent = "";
        const q = input.value.trim().toLowerCase();
        // The whole list, untyped or filtered -- never capped. A cap here
        // (Session 82 shipped .slice(0, 8), inherited from the old bar
        // typeahead) hid every value past the first eight with nothing to
        // scroll to; the menu's own max-height + overflow-y provides the
        // scrolling, exactly as the filter-bar selects show every value.
        const matches = spec.options().filter((v) => !q || v.toLowerCase().includes(q));
        for (const v of matches) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = v;
          // mousedown, not click: keeps focus in the input so blur (cancel)
          // does not fire before the pick lands.
          b.addEventListener("mousedown", (event) => {
            event.preventDefault();
            commit(v);
          });
          menu.appendChild(b);
        }
        if (!matches.length) {
          const hint = document.createElement("div");
          hint.className = "empty";
          hint.textContent = q ? "Enter saves \u201c" + input.value.trim() + "\u201d as a new " + spec.label : "No " + spec.label + " values yet";
          menu.appendChild(hint);
        }
      };
      renderMenu();
      input.addEventListener("input", renderMenu);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          commit(input.value);
        } else if (event.key === "Escape") {
          event.preventDefault();
          cancel();
        }
      });
      // Blur (click elsewhere, Tab) cancels; deferred so a mousedown pick
      // that has already committed is not undone.
      input.addEventListener("blur", () => setTimeout(cancel, 0));
      return wrap;
    }

    // Clicking anywhere outside an open editor or typeahead menu closes it.
    document.addEventListener("click", () => {
      for (const menu of document.querySelectorAll(".menu")) {
        menu.style.display = "none";
      }
      if (review.editing !== null) {
        review.editing = null;
        renderReview();
      }
    });

    // ------------------------------------------------------------------
    // Tab: Dashboard (Session 66)
    // ------------------------------------------------------------------
    const dashGranularityEl = document.getElementById("dash-granularity");
    const dashModeEl = document.getElementById("dash-mode");
    const dashModeButtons = Array.from(dashModeEl.querySelectorAll("button"));
    const dashCountFieldEl = document.getElementById("dash-count-field");
    const dashCountEl = document.getElementById("dash-count");
    const dashCountUnitEl = document.getElementById("dash-count-unit");
    const dashMonthFieldEl = document.getElementById("dash-month-field");
    const dashMonthEl = document.getElementById("dash-month");
    const dashQuarterFieldEl = document.getElementById("dash-quarter-field");
    const dashQuarterYearEl = document.getElementById("dash-quarter-year");
    const dashQuarterEl = document.getElementById("dash-quarter");
    const dashYearFieldEl = document.getElementById("dash-year-field");
    const dashYearEl = document.getElementById("dash-year");
    const dashStartFieldEl = document.getElementById("dash-start-field");
    const dashStartEl = document.getElementById("dash-start");
    const dashEndFieldEl = document.getElementById("dash-end-field");
    const dashEndEl = document.getElementById("dash-end");
    const dashStatusEl = document.getElementById("dash-status");
    const dashErrorEl = document.getElementById("dash-error");
    const dashSummaryEl = document.getElementById("dash-summary");
    const dashPeriodTextEl = document.getElementById("dash-period-text");
    const dashTotalTextEl = document.getElementById("dash-total-text");
    const dashChartWrapEl = document.getElementById("dash-chart-wrap");
    const dashLevelEls = Array.from(document.querySelectorAll("select.dash-level"));
    const dashShowingEl = document.getElementById("dash-showing");
    const dashCrumbsEl = document.getElementById("dash-crumbs");
    const dashTableHeadEl = document.getElementById("dash-table-head");
    const dashChartEl = document.getElementById("dash-chart");
    const dashChartNoteEl = document.getElementById("dash-chart-note");
    const dashTableEl = document.getElementById("dash-table");
    const dashInsightBtnEl = document.getElementById("dash-insight-btn");
    const dashInsightEl = document.getElementById("dash-insight");
    const dashInsightLabelEl = document.getElementById("dash-insight-label");
    const dashInsightTextEl = document.getElementById("dash-insight-text");
    const dashBodyEl = document.getElementById("dash-body");

    // Period state. Defaults: the last calendar month back from today. The
    // absolute pickers are seeded with the current month / quarter / year so
    // switching to "Specific" shows something sensible at once.
    const todayISO = new Date().toISOString().slice(0, 10);
    const DASH_DEFAULTS = {
      granularity: "month",
      mode: "relative",
      count: 1,
      month: todayISO.slice(0, 7),
      quarterYear: todayISO.slice(0, 4),
      quarter: String(Math.floor((Number(todayISO.slice(5, 7)) - 1) / 3) + 1),
      year: todayISO.slice(0, 4),
      start: "",
      end: "",
    };
    const dash = {
      ...DASH_DEFAULTS,
      expanded: new Set(), // table node paths ("L1 name" / "L1 name\u241f L2 name") open (in-memory)
      // Drill order (Session 77): a permutation of the three labels. The
      // chart shows the first level whose dimension has no active filter;
      // clicking a bar sets that dimension's filter (Session 76 row), so
      // there is no separate drill state -- the filters ARE the drill.
      order: ["merchant", "category", "subcategory"],
      // On-demand commentary (Session 69): null, or {state: "loading" |
      // "fresh" | "cached" | "unconfigured" | "unavailable" | "failed",
      // text, generatedAt}. In memory only -- never in the URL, never
      // auto-fetched; cleared by any change to the underlying view.
      insight: null,
      chart: null,          // the live Chart.js instance, if any
      data: null,
    };

    const UNIT_LABELS = { week: "weeks", month: "months", quarter: "quarters", year: "years" };
    const DASH_DIMS = ["merchant", "category", "subcategory"];
    const DASH_DEFAULT_ORDER = ["merchant", "category", "subcategory"];
    const DIM_LABEL = { merchant: "Merchant", category: "Category", subcategory: "Subcategory" };
    const DIM_PLURAL = { merchant: "merchants", category: "categories", subcategory: "subcategories" };

    // --- URL (d_ namespace) ---
    function dashboardURLParams() {
      const out = {};
      if (dash.order.join(",") !== DASH_DEFAULT_ORDER.join(",")) out.d_order = dash.order.join(",");
      if (dash.granularity !== DASH_DEFAULTS.granularity) out.d_granularity = dash.granularity;
      if (dash.granularity === "custom") {
        if (dash.start) out.d_start = dash.start;
        if (dash.end) out.d_end = dash.end;
        return out;
      }
      const mode = dash.granularity === "week" ? "relative" : dash.mode;
      if (mode !== DASH_DEFAULTS.mode) out.d_mode = mode;
      if (mode === "relative") {
        if (String(dash.count) !== String(DASH_DEFAULTS.count)) out.d_count = String(dash.count);
      } else if (dash.granularity === "month") {
        if (dash.month) out.d_month = dash.month;
      } else if (dash.granularity === "quarter") {
        if (dash.quarterYear && dash.quarter) out.d_quarter = dash.quarterYear + "-Q" + dash.quarter;
      } else if (dash.granularity === "year") {
        if (dash.year) out.d_year = dash.year;
      }
      return out;
    }

    function readDashboardURLParams(params) {
      const g = params.get("d_granularity");
      if (["week", "month", "quarter", "year", "custom"].includes(g)) dash.granularity = g;
      const m = params.get("d_mode");
      if (m === "absolute" || m === "relative") dash.mode = m;
      const c = parseInt(params.get("d_count") || "", 10);
      if (Number.isInteger(c) && c > 0) dash.count = c;
      const month = params.get("d_month");
      if (month && /^\d{4}-\d{2}$/.test(month)) dash.month = month;
      const q = params.get("d_quarter");
      const qm = q && /^(\d{4})-Q([1-4])$/.exec(q);
      if (qm) {
        dash.quarterYear = qm[1];
        dash.quarter = qm[2];
      }
      const y = params.get("d_year");
      if (y && /^\d{4}$/.test(y)) dash.year = y;
      const st = params.get("d_start");
      const en = params.get("d_end");
      if (st) dash.start = st;
      if (en) dash.end = en;
      if (dash.granularity === "week") dash.mode = "relative"; // week is relative-only
      const order = (params.get("d_order") || "").split(",").map((x) => x.trim());
      if (order.length === 3 && new Set(order).size === 3 && order.every((d) => DASH_DIMS.includes(d))) {
        dash.order = order;
      }
      syncPeriodControls();
      syncOrderControls();
    }

    // --- controls <-> state ---
    function syncPeriodControls() {
      dashGranularityEl.value = dash.granularity;
      const g = dash.granularity;
      const relativeOnly = g === "week";
      const isCustom = g === "custom";
      const mode = relativeOnly ? "relative" : dash.mode;
      // Mode toggle: hidden for week (relative-only, matching the API) and
      // for custom (no mode at all).
      dashModeEl.style.display = relativeOnly || isCustom ? "none" : "";
      for (const b of dashModeButtons) {
        b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
      }
      const showCount = !isCustom && mode === "relative";
      dashCountFieldEl.style.display = showCount ? "" : "none";
      dashCountEl.value = String(dash.count);
      dashCountUnitEl.textContent = UNIT_LABELS[g] || "";
      dashMonthFieldEl.style.display = !isCustom && mode === "absolute" && g === "month" ? "" : "none";
      dashMonthEl.value = dash.month;
      dashQuarterFieldEl.style.display = !isCustom && mode === "absolute" && g === "quarter" ? "" : "none";
      dashQuarterYearEl.value = dash.quarterYear;
      dashQuarterEl.value = dash.quarter;
      dashYearFieldEl.style.display = !isCustom && mode === "absolute" && g === "year" ? "" : "none";
      dashYearEl.value = dash.year;
      dashStartFieldEl.style.display = isCustom ? "" : "none";
      dashEndFieldEl.style.display = isCustom ? "" : "none";
      dashStartEl.value = dash.start;
      dashEndEl.value = dash.end;
    }

    // Query params for /transactions/aggregate from state, or null plus a
    // hint when the controls are not yet complete enough to ask (so an
    // obviously half-filled form doesn't round-trip a 422).
    function aggregateParams(filters) {
      const params = new URLSearchParams();
      const g = dash.granularity;
      params.set("granularity", g);
      if (g === "custom") {
        if (!dash.start || !dash.end) return { hint: "Choose both a start and an end date." };
        params.set("start", dash.start);
        params.set("end", dash.end);
      } else {
        const mode = g === "week" ? "relative" : dash.mode;
        params.set("mode", mode);
        if (mode === "relative") {
          if (!(Number.isInteger(dash.count) && dash.count > 0)) {
            return { hint: "Enter how many " + UNIT_LABELS[g] + " to look back." };
          }
          params.set("count", String(dash.count));
        } else if (g === "month") {
          if (!dash.month) return { hint: "Choose a month." };
          params.set("month", dash.month);
        } else if (g === "quarter") {
          if (!/^\d{4}$/.test(dash.quarterYear)) return { hint: "Enter a four-digit year." };
          params.set("quarter", dash.quarterYear + "-Q" + dash.quarter);
        } else if (g === "year") {
          if (!/^\d{4}$/.test(dash.year)) return { hint: "Enter a four-digit year." };
          params.set("year", dash.year);
        }
      }
      if (filters.bank) params.set("bank", filters.bank);
      if (filters.cardId) params.set("card_id", filters.cardId);
      for (const key of LABEL_FILTERS) if (filters[key]) params.set(key, filters[key]);
      // This tab always asks for the full three-level tree in the chosen
      // order; other callers of the endpoint keep its 2-level default.
      params.set("dimensions", dash.order.join(","));
      return { params };
    }

    // --- load, with its own out-of-order guard ---
    let dashSeq = 0;

    function loadDashboard(filters) {
      const seq = ++dashSeq;
      dashErrorEl.style.display = "none";
      renderCrumbs(filters); // reflect the new position at once, not after the fetch
      const built = aggregateParams(filters);
      if (!built.params) {
        dashStatusEl.textContent = built.hint;
        dashStatusEl.style.display = "";
        dashSummaryEl.style.display = "none";
        dashChartWrapEl.style.display = "none";
        dashChartNoteEl.style.display = "none";
        dashTableEl.style.display = "none";
        return Promise.resolve();
      }
      dashStatusEl.textContent = "Loading\u2026";
      dashStatusEl.style.display = "";
      return fetchJSON(withParams("/transactions/aggregate", built.params))
        .then((data) => {
          if (seq !== dashSeq) return;
          dash.data = data;
          renderDashboard(data);
        })
        .catch((error) => {
          if (seq !== dashSeq) return;
          dashStatusEl.style.display = "none";
          dashErrorEl.textContent = "Couldn\u2019t load spend: " + error.message;
          dashErrorEl.style.display = "";
          dashSummaryEl.style.display = "none";
          dashChartWrapEl.style.display = "none";
          dashChartNoteEl.style.display = "none";
          dashTableEl.style.display = "none";
        });
    }

    // --- render ---
    function renderDashboard(data) {
      dashStatusEl.style.display = "none";

      // Period and total exactly as the API reported them -- never recomputed.
      dashPeriodTextEl.textContent = data.period.start + " \u2192 " + data.period.end;
      dashTotalTextEl.textContent = fmtAmount(data.total);
      dashTotalTextEl.classList.toggle("negative", data.total < 0);
      dashSummaryEl.style.display = "";

      renderDashboardView();
    }

    // The display level: 1 + the number of contiguous levels, from Level 1
    // in the current order, whose dimension has an active filter. No
    // filters -> Level 1. Only Level 3's dimension filtered -> still Level
    // 1, narrowed by it. Levels 1 and 2 filtered -> Level 3. All three
    // filtered -> Level 3 (its single node). Zero-based here.
    function displayLevelIndex(filters) {
      let n = 0;
      while (n < 3 && filters[dash.order[n]]) n += 1;
      return Math.min(n, 2);
    }

    // Walk the returned tree down to the display level: every level above
    // it has an active filter, so the response holds exactly one node
    // there; take it and descend. Returns the array of nodes to chart, or
    // [] if the tree runs out (no data under the filters).
    function nodesAtDisplayLevel(data, levelIndex) {
      let nodes = data[DIM_PLURAL[dash.order[0]]] || [];
      for (let i = 0; i < levelIndex; i += 1) {
        if (!nodes.length) return [];
        nodes = nodes[0][DIM_PLURAL[dash.order[i + 1]]] || [];
      }
      return nodes;
    }

    // Both the chart and the table come from the one payload in hand.
    function renderDashboardView() {
      const filters = currentFilters();
      const levelIndex = displayLevelIndex(filters);
      const dim = dash.order[levelIndex];
      const nodes = nodesAtDisplayLevel(dash.data, levelIndex);
      const pinned = dash.order
        .slice(0, levelIndex)
        .map((d) => DIM_LABEL[d] + ": " + filters[d])
        .join(" \u203a ");
      dashShowingEl.textContent =
        "Bars: " + DIM_LABEL[dim] + (pinned ? " (within " + pinned + ")" : "");
      renderCrumbs(filters);
      renderDashboardChart(
        nodes.map((n) => ({ label: n[dim], amount: n.amount, transaction_count: n.transaction_count })),
        {
          // Level 3 is the leaf: nothing further to drill into.
          clickable: levelIndex < 2,
          emptyText: "No spend in this period for the current filters.",
          onBarClick: (label) => setLabelFilter(dim, label),
        },
      );
      renderDashboardTable(dash.data);
      renderInsight();
    }

    // --- breadcrumb (Session 78) -------------------------------------------
    // "All" plus one crumb per level -- in the CURRENT order -- whose
    // dimension has an active filter; levels with no filter are skipped, so
    // an out-of-order state (only Level 3's dimension set) shows a single
    // crumb. Clicking the crumb at order position i clears the filters at
    // positions i, i+1, i+2 -- that level and everything after it, whether
    // or not the in-between levels were set -- through the ordinary
    // onFilterChange() path, exactly as clearing those dropdowns by hand
    // would. "All" clears all three and is disabled when none is active.
    const LABEL_FILTER_ELS = {
      category: categoryFilterEl,
      subcategory: subcategoryFilterEl,
      merchant: merchantFilterEl,
    };

    function clearLabelsFromPosition(position) {
      let changed = false;
      for (let i = position; i < 3; i += 1) {
        const el = LABEL_FILTER_ELS[dash.order[i]];
        if (el.value) {
          el.value = "";
          changed = true;
        }
      }
      if (changed) onFilterChange();
    }

    function renderCrumbs(filters) {
      dashCrumbsEl.textContent = "";
      const anyActive = dash.order.some((d) => filters[d]);

      const root = document.createElement("button");
      root.type = "button";
      root.className = "crumb" + (anyActive ? "" : " current");
      root.textContent = "All";
      root.disabled = !anyActive;
      root.title = anyActive ? "Clear all three label filters" : "No label filter active";
      root.addEventListener("click", () => clearLabelsFromPosition(0));
      dashCrumbsEl.appendChild(root);

      const activePositions = [0, 1, 2].filter((i) => filters[dash.order[i]]);
      activePositions.forEach((i, idx) => {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = "\u203a";
        dashCrumbsEl.appendChild(sep);

        const dim = dash.order[i];
        const crumb = document.createElement("button");
        crumb.type = "button";
        const isLast = idx === activePositions.length - 1;
        crumb.className = "crumb" + (isLast ? " current" : "");
        crumb.textContent = DIM_LABEL[dim] + ": " + filters[dim];
        crumb.title = "Clear " + DIM_LABEL[dim].toLowerCase() + " and every level after it";
        crumb.addEventListener("click", () => clearLabelsFromPosition(i));
        dashCrumbsEl.appendChild(crumb);
      });
    }

    // Clicking a bar sets that dimension's filter dropdown (Session 76) and
    // goes through the ordinary filter-change path -- the full mesh refetch
    // and URL update. "Back" is clearing that dropdown. One mechanism (the
    // filters) instead of two doing overlapping jobs (filters plus a drill
    // stack that would have to be kept consistent with them).
    function setLabelFilter(dim, value) {
      const el = LABEL_FILTER_ELS[dim];
      if (!Array.from(el.options).some((o) => o.value === value)) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        el.appendChild(option);
      }
      el.value = value;
      onFilterChange();
    }

    // --- order selects: swap-on-conflict keeps a valid permutation ---------
    function syncOrderControls() {
      dashLevelEls.forEach((el, i) => {
        if (!el.options.length) {
          for (const d of DASH_DIMS) {
            const o = document.createElement("option");
            o.value = d;
            o.textContent = DIM_LABEL[d];
            el.appendChild(o);
          }
        }
        el.value = dash.order[i];
      });
    }

    for (const el of dashLevelEls) {
      el.addEventListener("change", () => {
        const i = Number(el.dataset.level);
        const wanted = el.value;
        const j = dash.order.indexOf(wanted);
        if (j === i) return;
        // Direct swap: the level that held `wanted` takes this level's old value.
        dash.order[j] = dash.order[i];
        dash.order[i] = wanted;
        syncOrderControls();
        clearInsight(); // the view changed shape
        const filters = currentFilters();
        updateURL(filters);
        loadDashboard(filters); // dimensions changed -> refetch; filters untouched
      });
    }

    // --- insight (LLM commentary), explicit click only ---------------------
    let insightSeq = 0;

    function clearInsight() {
      dash.insight = null;
      insightSeq += 1; // any in-flight response is now stale
      renderInsight();
    }

    function renderInsight() {
      const built = dash.data ? aggregateParams(currentFilters()) : { hint: true };
      const loading = dash.insight && dash.insight.state === "loading";
      dashInsightBtnEl.disabled = Boolean(loading || !built.params);
      dashInsightBtnEl.textContent = loading ? "Generating\u2026" : "Generate insight";

      const ins = dash.insight;
      if (!ins) {
        dashInsightEl.style.display = "none";
        dashInsightEl.className = "dash-insight";
        return;
      }
      let cls = "dash-insight", label = "", text = "";
      if (ins.state === "loading") {
        cls += " loading";
        label = "Asking for commentary on this view\u2026";
      } else if (ins.state === "fresh") {
        cls += " fresh";
        label = "Generated at " + ins.generatedAt + " UTC";
        text = ins.text;
      } else if (ins.state === "cached") {
        cls += " cached";
        label = "Cached \u2014 generated at " + ins.generatedAt + " UTC (a fresh result couldn\u2019t be fetched)";
        text = ins.text;
      } else if (ins.state === "unconfigured") {
        cls += " error";
        label = "Not available";
        text = "Commentary isn\u2019t configured for this deployment.";
      } else if (ins.state === "unavailable") {
        cls += " error";
        label = "Not available";
        text = "Insight unavailable for this view \u2014 try again.";
      } else {
        cls += " error";
        label = "Not available";
        text = "Couldn\u2019t fetch insight \u2014 try again.";
      }
      dashInsightEl.className = cls;
      dashInsightLabelEl.textContent = label;
      dashInsightTextEl.textContent = text;
      dashInsightEl.style.display = "";
    }

    function requestInsight() {
      // Same params as the aggregate call driving the view -- drill state is
      // deliberately not part of them: commentary always covers the full
      // category breakdown for the current period and filters.
      const built = aggregateParams(currentFilters());
      if (!built.params || (dash.insight && dash.insight.state === "loading")) return;
      const seq = ++insightSeq;
      dash.insight = { state: "loading" };
      renderInsight();
      postQuery(withParams("/analytics/commentary", built.params))
        .then((body) => {
          if (seq !== insightSeq) return; // view changed or re-clicked since
          dash.insight = {
            state: body.cached ? "cached" : "fresh",
            text: body.commentary,
            generatedAt: body.generated_at,
          };
          renderInsight();
        })
        .catch((error) => {
          if (seq !== insightSeq) return;
          const state =
            error.status === 500 ? "unconfigured"
            : error.status === 503 ? "unavailable"
            : "failed";
          dash.insight = { state };
          renderInsight();
        });
    }

    dashInsightBtnEl.addEventListener("click", requestInsight);

    // Draws one bar per item ({label, amount, transaction_count}) in the
    // order given -- the API's order at any level, never re-sorted. The
    // previous instance is always destroyed first, so redrawing repeatedly
    // never stacks canvases. `clickable` wires a bar click to onBarClick
    // (Level 1 and 2 bars); leaf bars are inert.
    function renderDashboardChart(items, { clickable, emptyText, onBarClick }) {
      if (dash.chart) {
        dash.chart.destroy();
        dash.chart = null;
      }
      dashChartEl.classList.toggle("clickable", Boolean(clickable));
      if (items.length === 0) {
        dashChartWrapEl.style.display = "none";
        dashChartNoteEl.textContent = emptyText;
        dashChartNoteEl.style.display = "";
        return;
      }
      if (typeof Chart === "undefined") {
        // CDN unavailable: the table below still carries everything.
        dashChartWrapEl.style.display = "none";
        dashChartNoteEl.textContent = "Chart library didn\u2019t load; the table below has the same figures.";
        dashChartNoteEl.style.display = "";
        return;
      }
      dashChartNoteEl.style.display = "none";
      dashChartWrapEl.style.display = "";
      const labels = items.map((c) => c.label);
      const values = items.map((c) => c.amount);
      const rootStyle = getComputedStyle(document.documentElement);
      const accent = rootStyle.getPropertyValue("--accent").trim() || "#0f6b6b";
      const credit = rootStyle.getPropertyValue("--credit").trim() || "#1a7f4b";
      dashChartWrapEl.style.height = Math.max(160, 36 * items.length + 60) + "px";
      dash.chart = new Chart(dashChartEl, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: values.map((v) => (v < 0 ? credit : accent)),
            borderRadius: 4,
            maxBarThickness: 28,
          }],
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          onClick: (_event, elements) => {
            if (!clickable || !elements.length) return;
            onBarClick(items[elements[0].index].label);
          },
          onHover: (event, elements) => {
            if (!clickable) return;
            event.native.target.style.cursor = elements.length ? "pointer" : "";
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const c = items[ctx.dataIndex];
                  return fmtAmount(c.amount) + " \u00b7 " + txnLabel(c.transaction_count) +
                    (clickable ? " \u00b7 click to filter by this" : "");
                },
              },
            },
          },
          scales: {
            x: {
              ticks: { callback: (v) => fmtAmount(v) },
              grid: { color: "rgba(31, 35, 40, 0.08)" },
            },
            y: { grid: { display: false } },
          },
        },
      });
    }

    // The whole tree for the current filters, in the current order, every
    // level collapsible; collapsed by default at levels 1 and 2 (the
    // existing group convention), leaves have nothing to open. The table
    // does not follow the chart's display level -- it always shows all of
    // it. Rows are not clickable; only chart bars set filters.
    function renderDashboardTable(data) {
      dashBodyEl.textContent = "";
      dashTableHeadEl.textContent =
        dash.order.map((d) => DIM_LABEL[d].toLowerCase()).join(" \u203a ");
      const top = data[DIM_PLURAL[dash.order[0]]] || [];
      if (top.length === 0) {
        dashTableEl.style.display = "none";
        return;
      }
      const SEP = "\u241f";

      const renderLevel = (nodes, depth, pathPrefix) => {
        const dim = dash.order[depth];
        const childKey = depth < 2 ? DIM_PLURAL[dash.order[depth + 1]] : null;
        for (const n of nodes) {
          const path = pathPrefix + n[dim];
          const children = childKey ? n[childKey] || [] : [];
          const canOpen = children.length > 0;
          const isOpen = canOpen && dash.expanded.has(path);
          const tr = document.createElement("tr");
          tr.className = "depth-" + depth + (isOpen ? " expanded" : "");

          const toggleCell = document.createElement("td");
          toggleCell.className = "select";
          if (canOpen) {
            const toggle = document.createElement("button");
            toggle.type = "button";
            toggle.className = "toggle";
            toggle.setAttribute("aria-expanded", String(isOpen));
            toggle.setAttribute("aria-label", (isOpen ? "Hide" : "Show") + " " + childKey + " of " + n[dim]);
            toggle.addEventListener("click", () => {
              if (isOpen) dash.expanded.delete(path);
              else dash.expanded.add(path);
              renderDashboardTable(dash.data);
            });
            toggleCell.appendChild(toggle);
          }
          tr.appendChild(toggleCell);

          const name = document.createElement("td");
          name.textContent = n[dim];
          tr.appendChild(name);

          const amount = document.createElement("td");
          amount.className = "num amount" + (n.amount < 0 ? " negative" : "");
          amount.textContent = fmtAmount(n.amount);
          tr.appendChild(amount);

          const count = document.createElement("td");
          count.className = "num";
          count.textContent = String(n.transaction_count);
          tr.appendChild(count);
          dashBodyEl.appendChild(tr);

          if (isOpen) renderLevel(children, depth + 1, path + SEP);
        }
      };
      renderLevel(top, 0, "");
      dashTableEl.style.display = "";
    }

    // --- control events: every change refetches at once (no Apply) ---
    function onPeriodChange() {
      clearInsight(); // the underlying query changed
      syncPeriodControls();
      const filters = currentFilters();
      updateURL(filters);
      loadDashboard(filters);
    }

    dashGranularityEl.addEventListener("change", () => {
      dash.granularity = dashGranularityEl.value;
      onPeriodChange();
    });
    for (const b of dashModeButtons) {
      b.addEventListener("click", () => {
        if (dash.mode === b.dataset.mode) return;
        dash.mode = b.dataset.mode;
        onPeriodChange();
      });
    }
    let dashTimer = null;
    const debouncedPeriodChange = () => {
      clearTimeout(dashTimer);
      dashTimer = setTimeout(onPeriodChange, DEBOUNCE_MS);
    };
    dashCountEl.addEventListener("input", () => {
      const n = parseInt(dashCountEl.value, 10);
      dash.count = Number.isInteger(n) ? n : NaN;
      debouncedPeriodChange();
    });
    dashMonthEl.addEventListener("input", () => {
      dash.month = dashMonthEl.value;
      debouncedPeriodChange();
    });
    dashQuarterYearEl.addEventListener("input", () => {
      dash.quarterYear = dashQuarterYearEl.value;
      debouncedPeriodChange();
    });
    dashQuarterEl.addEventListener("change", () => {
      dash.quarter = dashQuarterEl.value;
      onPeriodChange();
    });
    dashYearEl.addEventListener("input", () => {
      dash.year = dashYearEl.value;
      debouncedPeriodChange();
    });
    dashStartEl.addEventListener("input", () => {
      dash.start = dashStartEl.value;
      debouncedPeriodChange();
    });
    dashEndEl.addEventListener("input", () => {
      dash.end = dashEndEl.value;
      debouncedPeriodChange();
    });
    syncPeriodControls();

    // ------------------------------------------------------------------
    // Tabs
    // ------------------------------------------------------------------
    // "Reviewed" (Session 83) is the review panel with its row set pinned
    // to review_status=complete: same filter bar, same rows, same inline
    // editor and multi-select -- only the fetch's status differs and the
    // "Needs review only" toggle is hidden (it is what defines the tab).
    function setTab(tab, load) {
      activeTab = tab;
      const isReview = tab === "review";
      const isReviewed = tab === "reviewed";
      const isDashboard = tab === "dashboard";
      tabAllEl.classList.toggle("active", !isReview && !isReviewed && !isDashboard);
      tabReviewEl.classList.toggle("active", isReview);
      tabReviewedEl.classList.toggle("active", isReviewed);
      tabDashboardEl.classList.toggle("active", isDashboard);
      panelAllEl.style.display = isReview || isReviewed || isDashboard ? "none" : "";
      panelReviewEl.style.display = isReview || isReviewed ? "" : "none";
      panelDashboardEl.style.display = isDashboard ? "" : "none";
      uncategorizedOnlyLabelEl.style.display = isReview ? "" : "none";
      // Dashboard: period controls replace month/date filters; bank/card stay.
      statementMonthFieldEl.style.display = isDashboard ? "none" : "";
      startFieldEl.style.display = isDashboard ? "none" : "";
      endFieldEl.style.display = isDashboard ? "none" : "";
      if (load) {
        // Filters didn't change, so the pickers' options don't need
        // recomputing -- only the table for the newly active tab.
        const filters = currentFilters();
        updateURL(filters);
        loadActiveTab(filters);
      }
    }

    function loadActiveTab(filters) {
      if (activeTab === "review" || activeTab === "reviewed") loadReview(filters);
      else if (activeTab === "dashboard") loadDashboard(filters);
      else fetchTransactions(filters);
    }

    // ------------------------------------------------------------------
    // Filter pickers + initial load
    // ------------------------------------------------------------------
    function cardLabel(card) {
      return card.nickname ? card.card_type + " \u2014 " + card.nickname : card.card_type;
    }

    // Rebuild a <select>'s options, keeping its current value selected. If
    // the current value is no longer among the narrowed options it is kept
    // -- flagged, not silently cleared -- so the user sees why the table is
    // empty and can change it themselves; nothing changes filter state
    // behind their back.
    function setOptions(select, allLabel, options, current, emptyLabel) {
      select.textContent = "";
      const all = document.createElement("option");
      all.value = "";
      all.textContent = options.length || !emptyLabel ? allLabel : emptyLabel;
      select.appendChild(all);
      let seen = false;
      for (const o of options) {
        const option = document.createElement("option");
        option.value = o.value;
        option.textContent = o.label;
        if (o.value === current) seen = true;
        select.appendChild(option);
      }
      if (current && !seen) {
        const stale = document.createElement("option");
        stale.value = current;
        stale.textContent = current + " (no matching data)";
        select.appendChild(stale);
      }
      select.value = current;
    }

    // Every card the page has seen, by id, from whichever /cards response
    // came last -- so a picked card's bank can be looked up without another
    // request. Under "All banks" the list spans every bank.
    const cardsById = new Map();

    function rememberCards(cards) {
      for (const c of cards) cardsById.set(String(c.id), c);
    }

    // The one rule for Bank vs Card disagreement, used on URL load and on a
    // live card pick alike: a card belongs to exactly one bank, so the
    // card's bank wins whenever the two differ -- including when Bank is
    // "All banks". Session 48.
    function resolveBank(bank, card) {
      return card && card.bank !== bank ? card.bank : bank;
    }

    // Out-of-order guard for the option fetches, separate from the table's
    // requestSeq: both run on every filter change, and a slow options
    // response for an older filter set must not repopulate the pickers
    // after a newer one has.
    let optionsSeq = 0;

    // Bidirectional narrowing: every picker's options are recomputed from
    // the listing endpoints with every filter applied except the picker's
    // own. Card is subordinate to Bank, so Bank's options also leave Card
    // out (otherwise choosing a card would pin the bank list to one entry
    // and the user could never switch banks without clearing the card).
    //
    // Session 76: the three label pickers join the mesh. Each is narrowed
    // by bank / card / month / dates but NOT by the other two labels --
    // they are independent peers, not a cascade -- so their fetches omit
    // all three label filters; and the first row's pickers are narrowed by
    // the labels in return (buildParams sends them by default).
    function recomputeOptions(filters) {
      const seq = ++optionsSeq;
      const categoriesP = fetchJSON(withParams("/categories", buildParams(filters, LABEL_FILTERS)));
      // Unscoped call (no category=): the review editor's scoped call to the
      // same endpoint is a different concern and stays where it is.
      const subcategoriesP = fetchJSON(withParams("/subcategories", buildParams(filters, LABEL_FILTERS)));
      const merchantsP = fetchJSON(withParams("/merchants", buildParams(filters, LABEL_FILTERS)));

      const banksP = fetchJSON(
        withParams("/card-types", buildParams(filters, ["bank", "cardId"])),
      );
      // "All banks" is a bank selection like any other for Card's purposes:
      // it narrows Card's options (to every card with data under the other
      // filters) rather than locking the picker. Session 47.
      const cardsP = fetchJSON(withParams("/cards", buildParams(filters, ["cardId"])));
      const monthsP = fetchJSON(
        withParams("/statement-months", buildParams(filters, ["statementMonth"])),
      );
      const boundsP = hasDateFilter(filters)
        ? fetchJSON(withParams("/transactions", buildParams(filters, ["start", "end"])))
        : Promise.resolve(null);

      return Promise.all([banksP, cardsP, monthsP, boundsP, categoriesP, subcategoriesP, merchantsP])
        .then(([cardTypes, cards, months, undated, categories, subcategories, merchants]) => {
          if (seq !== optionsSeq) return; // a newer filter set has since been issued
          rememberCards(cards);
          setOptions(categoryFilterEl, "All categories", labelOptions(categories), filters.category);
          setOptions(subcategoryFilterEl, "All subcategories", labelOptions(subcategories), filters.subcategory);
          setOptions(merchantFilterEl, "All merchants", labelOptions(merchants), filters.merchant);
          const banks = Array.from(new Set(cardTypes.map((p) => p.bank)));
          setOptions(
            bankFilterEl,
            "All banks",
            banks.map((b) => ({ value: b, label: b })),
            filters.bank,
            "No banks with data",
          );
          setOptions(
            cardFilterEl,
            "All cards",
            cards.map((c) => ({ value: String(c.id), label: cardLabel(c) })),
            filters.cardId,
            "No cards with data",
          );
          setOptions(
            statementMonthFilterEl,
            "All months",
            months.map((m) => ({ value: m, label: m })),
            filters.statementMonth,
            "No statement months",
          );
          if (undated !== null) applyDateBounds(undated);
        })
        .catch(() => {
          // Options are a convenience layer over the table; a failed
          // options fetch leaves the pickers as they were, and the table's
          // own error path reports the problem.
        });
    }

    // On load the URL is the source of truth. Card and month are validated
    // against the *unfiltered* lists so a stale or hand-typed value falls
    // back to "all" rather than sticking as an invisible filter; the bank
    // is taken from the card when a card is given (the card wins), else
    // from the URL.
    function initFromURL() {
      const params = new URLSearchParams(window.location.search);
      const urlBank = params.get("bank") || "";
      const urlCardId = params.get("card_id") || "";
      const urlStatementMonth = params.get("statement_month") || "";
      const urlStart = params.get("start") || "";
      const urlEnd = params.get("end") || "";
      const urlLabels = {
        category: params.get("category") || "",
        subcategory: params.get("subcategory") || "",
        merchant: params.get("merchant") || "",
      };
      const urlTabRaw = params.get("tab");
      const urlTab = ["review", "reviewed", "dashboard"].includes(urlTabRaw) ? urlTabRaw : "all";
      readDashboardURLParams(params);
      readSortURLParams(params, "", allSort, tableEl);
      // "needs_review" since Session 81; the old "uncategorized" key is still
      // honoured so earlier bookmarks keep their meaning.
      uncategorizedOnlyEl.checked = params.get("needs_review") !== "0" && params.get("uncategorized") !== "0";

      startFilterEl.value = urlStart;
      endFilterEl.value = urlEnd;
      setTab(urlTab, false);

      statusEl.textContent = "Loading…";
      reviewStatusEl.textContent = "Loading…";

      Promise.all([fetchJSON("/cards"), fetchJSON("/statement-months")])
        .then(([cards, statementMonths]) => {
          const card = cards.find((c) => String(c.id) === urlCardId);
          const knownBanks = new Set(cards.map((c) => c.bank));
          rememberCards(cards);
          // Same rule as a live card pick (resolveBank): the card's bank
          // wins whenever it differs from the URL's bank, "All banks"
          // included -- so a reload lands where a live pick would have.
          const bank = resolveBank(knownBanks.has(urlBank) ? urlBank : "", card);
          const filters = {
            bank,
            cardId: card ? String(card.id) : "",
            statementMonth: statementMonths.includes(urlStatementMonth) ? urlStatementMonth : "",
            start: urlStart,
            end: urlEnd,
            ...urlLabels,
          };
          // Seed the selects with the resolved values so currentFilters()
          // reads them back; recomputeOptions() then fills in the options.
          // Label values are not validated against a list here: any value is
          // a legitimate exact-match filter, and a value with no data shows
          // as "(no matching data)" after the recompute, like any picker.
          const labelPickers = [
            ["category", categoryFilterEl, "All categories"],
            ["subcategory", subcategoryFilterEl, "All subcategories"],
            ["merchant", merchantFilterEl, "All merchants"],
          ];
          for (const [key, el, allLabel] of labelPickers) {
            const v = urlLabels[key];
            setOptions(el, allLabel, v ? [{ value: v, label: v }] : [], v);
          }
          setOptions(bankFilterEl, "All banks", bank ? [{ value: bank, label: bank }] : [], bank);
          setOptions(
            cardFilterEl,
            "All cards",
            card ? [{ value: String(card.id), label: cardLabel(card) }] : [],
            filters.cardId,
          );
          setOptions(
            statementMonthFilterEl,
            "All months",
            filters.statementMonth
              ? [{ value: filters.statementMonth, label: filters.statementMonth }]
              : [],
            filters.statementMonth,
          );
          updateURL(filters);
          recomputeOptions(filters);
          loadActiveTab(filters);
        })
        .catch((error) => {
          statusEl.textContent = "Error loading transactions: " + error.message;
          reviewStatusEl.textContent = "Error loading transactions: " + error.message;
        });
    }

    function onFilterChange() {
      // A real filter change (never a tab switch reaches here): the
      // dashboard's underlying query changed, so any commentary is stale.
      clearInsight();
      const filters = currentFilters();
      updateURL(filters);
      recomputeOptions(filters);
      loadActiveTab(filters);
    }

    function onCardChange() {
      // Picking a card whose bank differs from Bank (typically: Bank is
      // "All banks") sets Bank to that card's bank, then goes through the
      // ordinary filter-change path -- the same URL update, options
      // recompute, and table load a manual bank pick would trigger. It does
      // NOT go through onBankChange, which resets Card: the just-picked
      // card is the whole point. Card keeps its value; recomputeOptions
      // then re-lists the cards scoped to the new bank, which include it.
      const card = cardsById.get(cardFilterEl.value);
      const bank = resolveBank(bankFilterEl.value, card);
      if (bank !== bankFilterEl.value) {
        // Make sure the option exists before selecting it; the next
        // recompute rebuilds the list properly.
        if (!Array.from(bankFilterEl.options).some((o) => o.value === bank)) {
          const option = document.createElement("option");
          option.value = bank;
          option.textContent = bank;
          bankFilterEl.appendChild(option);
        }
        bankFilterEl.value = bank;
      }
      onFilterChange();
    }

    function onBankChange() {
      // Card is a child of Bank: a new bank always means "all cards" of it.
      cardFilterEl.value = "";
      onFilterChange();
    }

    function onDateInput() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(onFilterChange, DEBOUNCE_MS);
    }

    bankFilterEl.addEventListener("change", onBankChange);
    cardFilterEl.addEventListener("change", onCardChange);
    statementMonthFilterEl.addEventListener("change", onFilterChange);
    startFilterEl.addEventListener("input", onDateInput);
    endFilterEl.addEventListener("input", onDateInput);
    categoryFilterEl.addEventListener("change", onFilterChange);
    subcategoryFilterEl.addEventListener("change", onFilterChange);
    merchantFilterEl.addEventListener("change", onFilterChange);
    // "Needs review only" is a row-set filter (review_status=incomplete on
    // the server) since Session 81, so flipping it refetches. The URL is
    // updated so a reload keeps it.
    uncategorizedOnlyEl.addEventListener("change", () => {
      const filters = currentFilters();
      updateURL(filters);
      review.editing = null;
      loadReview(filters);
    });
    // Grouping mode: switching changes only how rows are grouped (and, in
    // similarity mode, which are shown) -- filters and selection are left
    // alone. Into similarity: cluster what is already loaded. Back to
    // suggested: the full reload the screen always did, suggestions
    // included, which shows every filtered row again.
    for (const radio of modeRadios) {
      radio.addEventListener("change", () => {
        if (!radio.checked) return;
        review.mode = radio.value;
        review.editing = null;
        if (review.mode === "similarity") {
          renderReview(); // show the threshold input and note straight away
          reloadClusters();
        } else {
          loadReview(currentFilters());
        }
      });
    }

    let thresholdTimer = null;
    thresholdInputEl.addEventListener("input", () => {
      clearTimeout(thresholdTimer);
      thresholdTimer = setTimeout(() => {
        const raw = Number(thresholdInputEl.value);
        if (!Number.isFinite(raw)) return;
        const value = Math.min(100, Math.max(0, Math.round(raw)));
        if (String(value) !== thresholdInputEl.value) thresholdInputEl.value = String(value);
        if (value === review.threshold) return;
        review.threshold = value;
        if (review.mode === "similarity") reloadClusters();
      }, DEBOUNCE_MS);
    });

    tabAllEl.addEventListener("click", () => setTab("all", true));
    tabReviewEl.addEventListener("click", () => setTab("review", true));
    wireSortableHeaders(tableEl, allSort, () => {
      updateURL(currentFilters());
      renderTransactionsSorted();
    });
    tabReviewedEl.addEventListener("click", () => setTab("reviewed", true));
    tabDashboardEl.addEventListener("click", () => setTab("dashboard", true));

    initFromURL();
  </script>
</body>
</html>
