<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transactions</title>
<!-- Chart.js, pinned. The project's first external frontend dependency
     (Session 66); loaded like any other script -- no bundler, no build step.
     The dashboard degrades to its table if this fails to load. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --page: #f6f6f4;
    --surface: #ffffff;
    --ink: #1f2328;
    --muted: #636c76;
    --rule: #e4e6ea;
    --rule-strong: #d0d4da;
    --accent: #0f6b6b;
    --accent-ink: #0b5252;
    --accent-wash: #e7f3f2;
    --accent-wash-strong: #d2e8e6;
    --edit-wash: #fff6dc;
    --edit-line: #b8860b;
    --hover: #f2f3f5;
    --credit: #1a7f4b;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 14px rgba(31, 35, 40, 0.05);
    --shadow-pop: 0 6px 22px rgba(31, 35, 40, 0.14), 0 1px 3px rgba(31, 35, 40, 0.1);
    --radius: 10px;
    --radius-sm: 6px;
    --focus: 0 0 0 3px rgba(15, 107, 107, 0.28);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    margin: 0;
    padding: 2rem 2.5rem 4rem;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 1.25rem;
  }

  button, input, select {
    font: inherit;
    color: inherit;
  }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: none;
    box-shadow: var(--focus);
  }

  /* --- tabs ----------------------------------------------------------- */
  #tabs {
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid var(--rule-strong);
    margin-bottom: 1.5rem;
  }
  #tabs button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 0.6rem 0.9rem;
    color: var(--muted);
    cursor: pointer;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    transition: color 120ms ease, background 120ms ease;
  }
  #tabs button:hover {
    color: var(--ink);
    background: rgba(31, 35, 40, 0.04);
  }
  #tabs button.active {
    color: var(--accent-ink);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  /* --- filters -------------------------------------------------------- */
  #filters {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.1rem 1.25rem 0.35rem;
    margin-bottom: 1.5rem;
  }
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem 1.75rem;
    align-items: flex-end;
    margin-bottom: 0.9rem;
  }
  .filter-row label {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .filter-row select,
  .filter-row input[type="date"] {
    min-width: 12rem;
    padding: 0.42rem 0.6rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.92rem;
  }
  .filter-row select:hover,
  .filter-row input[type="date"]:hover {
    border-color: #b6bcc4;
  }
  .filter-row-labels {
    border-top: 1px solid var(--rule);
    padding-top: 0.9rem;
  }
  .filter-row label.inline {
    flex-direction: row;
    align-items: center;
    gap: 0.5rem;
    color: var(--ink);
    font-size: 0.9rem;
    padding-bottom: 0.45rem;
    cursor: pointer;
  }
  input[type="checkbox"] {
    width: 1rem;
    height: 1rem;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* --- status / messages --------------------------------------------- */
  #status, #review-status {
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 0.9rem;
  }
  .error {
    color: var(--danger);
    background: #fdf0ef;
    border: 1px solid #f3c9c5;
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.9rem;
    font-size: 0.92rem;
    margin-bottom: 1rem;
  }
  .mode-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 1.1rem;
    margin-bottom: 0.9rem;
    font-size: 0.9rem;
  }
  .mode-bar .mode-label {
    color: var(--muted);
  }
  .mode-option {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
  }
  .mode-option input[type="radio"] {
    accent-color: var(--accent);
    margin: 0;
  }
  .mode-option.threshold {
    color: var(--muted);
  }
  .mode-option.threshold input {
    width: 4.2rem;
    padding: 0.25rem 0.4rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .mode-note {
    color: var(--muted);
    font-size: 0.9rem;
    margin: -0.4rem 0 0.9rem;
  }
  /* --- dashboard --------------------------------------------------------- */
  .period-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 1.5rem;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  .period-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .period-field select, .period-field input {
    padding: 0.42rem 0.6rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.92rem;
  }
  .period-field input[type="number"] {
    width: 5.5rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .period-inline {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--ink);
    font-size: 0.92rem;
  }
  .period-mode {
    align-self: flex-end;
    margin-bottom: 0.1rem;
  }
  .segmented.period-mode button {
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .dash-status {
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 0.9rem;
  }
  .dash-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 3rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  .dash-summary-label {
    display: block;
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 0.2rem;
  }
  .dash-period-text {
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .dash-total-text {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .dash-total-text.negative {
    color: var(--credit);
  }
  .dash-order {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem 1.1rem;
    margin-bottom: 0.6rem;
    font-size: 0.9rem;
  }
  .dash-order .period-field {
    flex-direction: row;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
  }
  .dash-order-label {
    color: var(--muted);
  }
  .dash-showing {
    margin-left: auto;
    color: var(--ink);
    font-weight: 600;
  }
  .dash-crumbs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 0.7rem;
    font-size: 0.9rem;
  }
  .dash-crumbs .crumb {
    font: inherit;
    font-size: 0.88rem;
    padding: 0.25rem 0.65rem;
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--accent-ink);
    cursor: pointer;
  }
  .dash-crumbs .crumb:hover:not(:disabled) {
    background: var(--accent-wash);
    border-color: var(--accent);
  }
  .dash-crumbs .crumb:disabled {
    color: var(--muted);
    border-color: var(--rule);
    cursor: default;
  }
  .dash-crumbs .crumb.current {
    background: var(--accent-wash);
    border-color: var(--accent-wash-strong);
  }
  .dash-crumbs .sep {
    color: var(--muted);
  }
  #dash-table tr.depth-1 td {
    background: #fafafb;
  }
  #dash-table tr.depth-1 td:nth-child(2) {
    padding-left: 2.4rem;
  }
  #dash-table tr.depth-2 td {
    background: #f4f5f7;
    color: var(--muted);
  }
  #dash-table tr.depth-2 td:nth-child(2) {
    padding-left: 4rem;
  }
  .dash-chart-wrap canvas.clickable {
    cursor: pointer;
  }
  .dash-insight-action {
    margin-left: auto;
    align-self: center;
  }
  .dash-insight-action button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-size: 0.9rem;
    padding: 0.45rem 1rem;
  }
  .dash-insight-action button.primary:hover:not(:disabled) {
    background: var(--accent-ink);
    border-color: var(--accent-ink);
    color: #fff;
  }
  .dash-insight-action button.primary:disabled {
    opacity: 0.6;
    cursor: default;
  }
  /* Three visually distinct states: fresh (accent), cached (amber), and
     the two error kinds (danger), each with a left rule and its own tint. */
  .dash-insight {
    border: 1px solid var(--rule);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 0.9rem 1.1rem;
    margin: -0.5rem 0 1.25rem;
  }
  .dash-insight-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
    font-variant-numeric: tabular-nums;
  }
  .dash-insight-text {
    margin: 0;
    line-height: 1.55;
    max-width: 70ch;
  }
  .dash-insight.fresh {
    border-left-color: var(--accent);
    background: var(--accent-wash);
  }
  .dash-insight.cached {
    border-left-color: var(--edit-line);
    background: var(--edit-wash);
  }
  .dash-insight.cached .dash-insight-label {
    color: #7a5a00;
    font-weight: 600;
  }
  .dash-insight.error {
    border-left-color: var(--danger);
    background: #fdf0ef;
  }
  .dash-insight.error .dash-insight-text {
    color: var(--danger);
  }
  .dash-insight.loading {
    border-left-color: var(--rule-strong);
    color: var(--muted);
  }
  .dash-chart-wrap {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
    position: relative;
  }
  #dash-table td.negative {
    color: var(--credit);
  }
  #dash-table .toggle {
    width: 1.6rem;
    height: 1.6rem;
    border: none;
    border-radius: var(--radius-sm);
    background: none;
    cursor: pointer;
    position: relative;
  }
  #dash-table .toggle::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0.45rem;
    height: 0.45rem;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: translate(-65%, -50%) rotate(-45deg);
    transition: transform 140ms ease;
  }
  #dash-table tr.expanded .toggle::before {
    transform: translate(-50%, -65%) rotate(45deg);
  }
  #dash-table .toggle:hover {
    background: rgba(31, 35, 40, 0.06);
  }

  /* --- modal ---------------------------------------------------------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(31, 35, 40, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow-pop);
    max-width: 30rem;
    width: 100%;
    padding: 1.25rem 1.4rem 1.1rem;
  }
  .modal-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 0.6rem;
  }
  .modal-message {
    margin: 0 0 1.1rem;
    line-height: 1.5;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
  }
  .modal-actions button.small {
    font-size: 0.9rem;
    padding: 0.4rem 0.9rem;
  }
  .modal-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .modal-actions button.primary:hover:not(:disabled) {
    background: var(--accent-ink);
    border-color: var(--accent-ink);
    color: #fff;
  }
  /* --- card payment cell ------------------------------------------------ */
  th.payment, td.payment {
    width: 7rem;
    text-align: center;
  }
  td.payment .row-error {
    display: block;
    color: var(--danger);
    font-size: 0.78rem;
    text-align: left;
    white-space: normal;
    margin-top: 0.3rem;
  }
  .nothing-left {
    background: var(--surface);
    border: 1px dashed var(--rule-strong);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* --- tables --------------------------------------------------------- */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    /* No overflow:hidden here -- it would clip the "change" dropdown, which
       is positioned inside a cell. The corners are rounded per-cell below. */
  }
  thead th:first-child { border-top-left-radius: var(--radius); }
  thead th:last-child { border-top-right-radius: var(--radius); }
  tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius); }
  tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius); }
  th, td {
    text-align: left;
    padding: 0.7rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    vertical-align: middle;
  }
  th {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    background: #fafafb;
    letter-spacing: 0.01em;
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  /* Full-row hover: paint every cell, and keep the row's own state colours
     (selected / editing) on top of it. */
  tbody tr:hover td {
    background: var(--hover);
  }
  tbody tr.group:hover td {
    background: #eef0f2;
  }
  tr.selected td,
  tbody tr.selected:hover td {
    background: var(--accent-wash);
  }
  tr.editing td,
  tbody tr.editing:hover td {
    background: var(--edit-wash);
  }

  th[data-sort] {
    cursor: pointer;
    user-select: none;
  }
  th[data-sort]:hover {
    color: var(--ink);
  }
  th[data-sort] .sort-arrow {
    display: inline-block;
    width: 1em;
    margin-left: 0.25rem;
    color: var(--accent);
  }
  th.num, td.num {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  th.amount, td.amount {
    text-align: right;
  }
  td.amount.credit {
    color: var(--credit);
  }
  th.type, td.type {
    width: 6rem;
  }
  .pill {
    display: inline-block;
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .pill.debit {
    color: var(--muted);
    background: #f0f1f3;
    border-color: #e2e4e8;
  }
  .pill.credit {
    color: var(--credit);
    background: #e8f5ee;
    border-color: #cfe9d9;
  }
  #review-table th.select, td.select {
    width: 2.5rem;
    padding-right: 0;
  }

  /* --- buttons -------------------------------------------------------- */
  button.small, .selection-bar button {
    font-size: 0.82rem;
    font-weight: 500;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  button.small:hover:not(:disabled), .selection-bar button:hover:not(:disabled) {
    background: var(--accent-wash);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button.small:disabled, .selection-bar button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button.link, .selection-bar button.link {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button.link:hover, .selection-bar button.link:hover {
    color: var(--accent-ink);
    background: none;
  }

  /* --- Review & assign: selection bar ---------------------------------- */
  /* Sticky once shown: pinned a little below the viewport top so it stays
     in reach while scrolling long lists. The sentinel just before it lets
     an IntersectionObserver tell "stuck" from "in place"; only the stuck
     state gets the shadow, so it reads as floating over the content. */
  :root { --bar-top: 0.75rem; }
  #selection-bar-sentinel {
    height: 1px;
    margin-top: -1px;
  }
  .selection-bar {
    position: sticky;
    top: var(--bar-top);
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem 1.1rem;
    align-items: center;
    background: var(--accent-wash);
    border: 1px solid var(--accent-wash-strong);
    border-radius: var(--radius);
    padding: 0.7rem 1rem;
    margin-bottom: 1rem;
    color: var(--accent-ink);
    transition: box-shadow 120ms ease;
  }
  .selection-bar.stuck {
    box-shadow: var(--shadow-pop);
    border-color: var(--accent);
  }
  /* While the bar is shown, group header rows stick just beneath it
     instead of sliding under it -- so the header nearest the top, chevron
     included, is never hidden by the bar. --bar-offset is set from the
     bar's measured height. Off when there is no bar: no behaviour change
     for the unselected state. */
  #panel-review.has-selection tr.group td {
    position: sticky;
    top: var(--bar-offset, 0px);
    z-index: 5;
  }
  .segmented {
    display: inline-flex;
    border: 1px solid var(--accent-wash-strong);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--surface);
  }
  .segmented button, .selection-bar .segmented button {
    border: none;
    border-radius: 0;
    padding: 0.3rem 0.75rem;
    background: transparent;
    color: var(--muted);
  }
  .segmented button + button {
    border-left: 1px solid var(--accent-wash-strong);
  }
  .segmented button[aria-pressed="true"],
  .selection-bar .segmented button[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
  }
  .selection-bar .label {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .typeahead {
    position: relative;
  }
  .typeahead input {
    min-width: 17rem;
    padding: 0.38rem 0.65rem;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 0.92rem;
  }
  .menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 10;
    min-width: 100%;
    max-height: 16rem;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-pop);
    padding: 0.25rem 0;
    color: var(--ink);
  }
  .menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 0;
    padding: 0.42rem 0.8rem;
    font-size: 0.92rem;
    font-weight: 400;
    cursor: pointer;
    white-space: nowrap;
  }
  .menu button:hover, .menu button:focus {
    background: var(--accent-wash);
    color: var(--accent-ink);
    outline: none;
    box-shadow: none;
  }
  .menu button.create {
    color: var(--accent);
    font-weight: 500;
  }
  .menu .empty {
    padding: 0.42rem 0.8rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* --- Review & assign: group header ----------------------------------- */
  tr.group td {
    background: #f4f5f7;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule);
    padding: 0.55rem 0.9rem;
  }
  tbody tr:first-child.group td {
    border-top: none;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    flex-wrap: wrap;
  }
  .group-head .toggle {
    width: 1.6rem;

<body>

  <script>
    // ------------------------------------------------------------------
    // Shared: filters, fetch helpers, URL state
    // ------------------------------------------------------------------
    const statusEl = document.getElementById("status");
    const tableEl = document.getElementById("transactions-table");
    const bodyEl = document.getElementById("transactions-body");
    const bankFilterEl = document.getElementById("bank-filter");
    const cardFilterEl = document.getElementById("card-filter");
    const statementMonthFilterEl = document.getElementById("statement-month-filter");
    const startFilterEl = document.getElementById("start-filter");
    const endFilterEl = document.getElementById("end-filter");
    const categoryFilterEl = document.getElementById("category-filter");
    const subcategoryFilterEl = document.getElementById("subcategory-filter");
    const merchantFilterEl = document.getElementById("merchant-filter");
    const uncategorizedOnlyLabelEl = document.getElementById("uncategorized-only-label");
    const uncategorizedOnlyEl = document.getElementById("uncategorized-only-filter");

    const tabAllEl = document.getElementById("tab-all");
    const tabReviewEl = document.getElementById("tab-review");
    const tabReviewedEl = document.getElementById("tab-reviewed");
    const tabDashboardEl = document.getElementById("tab-dashboard");
    const panelAllEl = document.getElementById("panel-all");
    const panelReviewEl = document.getElementById("panel-review");
    const panelDashboardEl = document.getElementById("panel-dashboard");
    // The shared filter bar's month and date fields are hidden on the
    // dashboard, whose period controls supersede them; bank/card stay.
    const statementMonthFieldEl = statementMonthFilterEl.closest("label");
    const startFieldEl = startFilterEl.closest("label");
    const endFieldEl = endFilterEl.closest("label");

    const reviewStatusEl = document.getElementById("review-status");
    const reviewModeNoteEl = document.getElementById("review-mode-note");
    const modeRadios = Array.from(document.querySelectorAll('input[name="review-mode"]'));
    const thresholdLabelEl = document.getElementById("threshold-label");
    const thresholdInputEl = document.getElementById("threshold-input");
    const reviewErrorEl = document.getElementById("review-error");
    const selectionBarEl = document.getElementById("selection-bar");
    const selectionBarSentinelEl = document.getElementById("selection-bar-sentinel");
    const nothingLeftEl = document.getElementById("nothing-left");
    const reviewTableEl = document.getElementById("review-table");
    const reviewBodyEl = document.getElementById("review-body");

    // Out-of-order guard: only the response from the most recently issued
    // load is allowed to render. Without this, a slow response to an
    // earlier filter change could land after (and overwrite) the result of
    // a newer one. One counter serves both tabs, since only the active tab
    // ever loads.
    let requestSeq = 0;

    let debounceTimer = null;
    const DEBOUNCE_MS = 300;

    let activeTab = "all";

    function extractErrorMessage(response) {
      return response
        .json()
        .then(
          (body) => (body && body.detail ? JSON.stringify(body.detail) : String(response.status)),
          () => String(response.status),
        );
    }

    function handleResponse(response) {
      if (!response.ok) {
        return extractErrorMessage(response).then((message) => {
          const error = new Error(message);
          error.status = response.status; // callers may branch on it (Session 69)
          throw error;
        });
      }
      return response.json();
    }

    function fetchJSON(url) {
      return fetch(url).then(handleResponse);
    }

    // POST with query params and no body -- for action endpoints that take
    // the same params as a GET (POST /analytics/commentary).
    function postQuery(url) {
      return fetch(url, { method: "POST" }).then(handleResponse);
    }

    function postJSON(url, body) {
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(handleResponse);
    }

    function currentFilters() {
      return {
        bank: bankFilterEl.value,
        cardId: cardFilterEl.value,
        statementMonth: statementMonthFilterEl.value,
        start: startFilterEl.value,
        end: endFilterEl.value,
        category: categoryFilterEl.value,
        subcategory: subcategoryFilterEl.value,
        merchant: merchantFilterEl.value,
      };
    }

    // Query params for a filter set. `omit` names filters to leave out --
    // that is how a picker's own options are computed "as if it were not
    // set", so a picker can never narrow itself out of the options it needs
    // to change its own value.
    function buildParams(filters, omit) {
      const skip = new Set(omit || []);
      const params = new URLSearchParams();
      if (filters.bank && !skip.has("bank")) params.set("bank", filters.bank);
      if (filters.cardId && !skip.has("cardId")) params.set("card_id", filters.cardId);
      if (filters.statementMonth && !skip.has("statementMonth")) {
        params.set("statement_month", filters.statementMonth);
      }
      if (filters.start && !skip.has("start")) params.set("start", filters.start);
      if (filters.end && !skip.has("end")) params.set("end", filters.end);
      // The three labels (Session 76). "Uncategorized" is sent literally; the
      // API maps it to IS NULL.
      if (filters.category && !skip.has("category")) params.set("category", filters.category);
      if (filters.subcategory && !skip.has("subcategory")) params.set("subcategory", filters.subcategory);
      if (filters.merchant && !skip.has("merchant")) params.set("merchant", filters.merchant);
      return params;
    }

    const LABEL_FILTERS = ["category", "subcategory", "merchant"];
    const UNCATEGORIZED = "Uncategorized";

    // Options for a label picker: the API's distinct values plus the
    // synthetic "Uncategorized" entry, always offered so the unlabelled rows
    // are reachable whatever the current data returns.
    function labelOptions(values) {
      const opts = values.map((v) => ({ value: v, label: v }));
      if (!values.includes(UNCATEGORIZED)) opts.push({ value: UNCATEGORIZED, label: UNCATEGORIZED });
      return opts;
    }

    function withParams(path, params) {
      const query = params.toString();
      return path + (query ? "?" + query : "");
    }

    function updateURL(filters) {
      // The API params, plus the two pieces of UI state that aren't API
      // filters (tab, uncategorized-only) so a reload lands where you were.
      const params = buildParams(filters);
      if (activeTab === "review") {
        params.set("tab", "review");
        if (!uncategorizedOnlyEl.checked) params.set("needs_review", "0");
      } else if (activeTab === "reviewed") {
        params.set("tab", "reviewed");
      } else if (activeTab === "dashboard") {
        params.set("tab", "dashboard");
      }
      // Dashboard period state rides along in its own d_ namespace whatever
      // tab is active, so it survives a reload from any tab and never
      // collides with the other tabs' params. Defaults are omitted.
      for (const [key, value] of Object.entries(dashboardURLParams())) params.set(key, value);
      // Table sorts (Session 85), likewise namespaced and omitted when unset.
      for (const [key, value] of Object.entries(sortURLParams("", allSort))) params.set(key, value);
      window.history.replaceState(null, "", withParams(window.location.pathname, params));
    }

    function transactionsURL(filters) {
      return withParams("/transactions", buildParams(filters));
    }

    // The date inputs' "options" are their min/max bounds: the earliest and
    // latest transaction dates given every filter *except* the dates. When
    // no date is set, the table's own result is exactly that set, so the
    // loaders pass it here for free; only when a date is set does
    // recomputeOptions() fetch the undated set separately.
    function applyDateBounds(transactions) {
      let min = "", max = "";
      for (const t of transactions) {
        if (!min || t.txn_date < min) min = t.txn_date;
        if (!max || t.txn_date > max) max = t.txn_date;
      }
      for (const el of [startFilterEl, endFilterEl]) {
        if (min) el.min = min; else el.removeAttribute("min");
        if (max) el.max = max; else el.removeAttribute("max");
        el.title = min ? "Data from " + min + " to " + max : "";
      }
    }

    function hasDateFilter(filters) {
      return Boolean(filters.start || filters.end);
    }

    // ------------------------------------------------------------------
    // Sortable columns (Session 85). One small module, reused by any flat
    // table: a sort state {key, dir}, a comparator with NULL/unset last
    // regardless of direction (the same "Uncategorized is its own bucket"
    // stance the rest of the app takes), header wiring with an arrow and
    // aria-sort, and URL round-trip under a per-table prefix.
    // ------------------------------------------------------------------
    const NUMERIC_SORT_KEYS = new Set(["amount"]);

    function makeSort() {
      return { key: null, dir: "asc" };
    }

    function isUnset(v) {
      return v === null || v === undefined || v === "";
    }

    function compareValues(a, b, key) {
      if (NUMERIC_SORT_KEYS.has(key)) return Number(a) - Number(b);
      // ISO dates compare correctly as strings; other text case-insensitively.
      return String(a).localeCompare(String(b), undefined, { sensitivity: "base" });
    }

    // Returns a sorted copy; input order is preserved among equal keys
    // (Array.prototype.sort is stable) and untouched when no sort is set.
    function sortRows(rows, sort) {
      if (!sort.key) return rows.slice();
      const key = sort.key;
      const sign = sort.dir === "desc" ? -1 : 1;
      const set = rows.filter((r) => !isUnset(r[key]));
      const unset = rows.filter((r) => isUnset(r[key]));
      set.sort((x, y) => sign * compareValues(x[key], y[key], key));
      return set.concat(unset); // unset last, whichever direction
    }

    // Click: same column toggles direction; a new column starts ascending.
    function toggleSort(sort, key) {
      if (sort.key === key) sort.dir = sort.dir === "asc" ? "desc" : "asc";
      else {
        sort.key = key;
        sort.dir = "asc";
      }
    }

    function renderSortIndicators(tableEl, sort) {
      for (const th of tableEl.querySelectorAll("th[data-sort]")) {
        const active = th.dataset.sort === sort.key;
        let arrow = th.querySelector(".sort-arrow");
        if (!arrow) {
          arrow = document.createElement("span");
          arrow.className = "sort-arrow";
          arrow.setAttribute("aria-hidden", "true");
          th.appendChild(arrow);
        }
        arrow.textContent = active ? (sort.dir === "desc" ? "\u25be" : "\u25b4") : "";
        if (active) th.setAttribute("aria-sort", sort.dir === "desc" ? "descending" : "ascending");
        else th.removeAttribute("aria-sort");
      }
    }

    function wireSortableHeaders(tableEl, sort, onChange) {
      for (const th of tableEl.querySelectorAll("th[data-sort]")) {
        th.title = "Sort by " + th.textContent.trim();
        th.addEventListener("click", () => {
          toggleSort(sort, th.dataset.sort);
          onChange();
        });
      }
      renderSortIndicators(tableEl, sort);
    }

    // URL: <prefix>sort=<key>&<prefix>dir=<asc|desc>, omitted when unsorted.
    function sortURLParams(prefix, sort) {
      const out = {};
      if (sort.key) {
        out[prefix + "sort"] = sort.key;
        if (sort.dir === "desc") out[prefix + "dir"] = "desc";
      }
      return out;
    }

    function readSortURLParams(params, prefix, sort, tableEl) {
      const key = params.get(prefix + "sort");
      const allowed = new Set(Array.from(tableEl.querySelectorAll("th[data-sort]")).map((th) => th.dataset.sort));
      if (key && allowed.has(key)) {
        sort.key = key;
        sort.dir = params.get(prefix + "dir") === "desc" ? "desc" : "asc";
      }
    }

    // The stored txn_type is lowercase ("debit"/"credit"); it's shown
    // capitalised, as a small pill, in both tables.
    function displayType(txnType) {
      const t = String(txnType || "");
      return t.charAt(0).toUpperCase() + t.slice(1);
    }

    function typeCell(txn) {
      const cell = document.createElement("td");
      cell.className = "type";
      const pill = document.createElement("span");
      pill.className = "pill " + txn.txn_type;
      pill.textContent = displayType(txn.txn_type);
      cell.appendChild(pill);
      return cell;
    }

    // ------------------------------------------------------------------
    // Tab: All transactions
    // ------------------------------------------------------------------
    // The last-won filtered row set and this table's own sort. A header
    // click re-renders from allRows without a fetch; a new fetch replaces
    // allRows (only if it wins the sequence race) and the active sort is
    // re-applied to the new rows rather than reset.
    let allRows = [];
    const allSort = makeSort();

    function renderTransactions(transactions) {
      allRows = transactions;
      renderTransactionsSorted();
    }

    function renderTransactionsSorted() {
      const transactions = sortRows(allRows, allSort);
      renderSortIndicators(tableEl, allSort);
      bodyEl.textContent = "";

      if (transactions.length === 0) {
        statusEl.textContent = "No transactions found.";
        tableEl.style.display = "none";
        return;
      }

      for (const txn of transactions) {
        const row = document.createElement("tr");

        const dateCell = document.createElement("td");
        dateCell.className = "num";
        dateCell.textContent = txn.txn_date;
        row.appendChild(dateCell);

        const descriptionCell = document.createElement("td");
        descriptionCell.textContent = txn.description;
        row.appendChild(descriptionCell);

        row.appendChild(typeCell(txn));

        const amountCell = document.createElement("td");
        amountCell.className = "num amount " + txn.txn_type;
        amountCell.textContent = txn.amount;
        row.appendChild(amountCell);

        // Read-only labels here; the Review & assign tab is where they change.
        for (const value of [txn.merchant, txn.category, txn.subcategory]) {
          const cell = document.createElement("td");
          if (value === null || value === undefined) {
            cell.className = "unset";
            cell.textContent = "\u2014";
          } else {
            cell.textContent = value;
          }
          row.appendChild(cell);
        }

        bodyEl.appendChild(row);
      }

      statusEl.textContent = "";
      tableEl.style.display = "";
    }

    function fetchTransactions(filters) {
      const seq = ++requestSeq;

      statusEl.textContent = "Loading…";
      tableEl.style.display = "none";

      fetchJSON(transactionsURL(filters))
        .then((transactions) => {
          if (seq !== requestSeq) return; // a newer request has since been issued
          if (!hasDateFilter(filters)) applyDateBounds(transactions);
          renderTransactions(transactions);
        })
        .catch((error) => {
          if (seq !== requestSeq) return;
          statusEl.textContent = "Error loading transactions: " + error.message;
        });
    }

    // ------------------------------------------------------------------
    // Confirmation modal (reusable)
    // ------------------------------------------------------------------
    // showModal({title, message, confirmLabel, cancelLabel}) -> Promise<bool>.
    // Resolves true on Confirm, false on Cancel, Escape, or a click on the
    // backdrop. One instance in the DOM; only one dialog can be open at a
    // time (a second call while open resolves false immediately). Focus
    // moves to Confirm on open and back to the opener on close.
    const modalOverlayEl = document.getElementById("modal-overlay");
    const modalTitleEl = document.getElementById("modal-title");
    const modalMessageEl = document.getElementById("modal-message");
    const modalCancelEl = document.getElementById("modal-cancel");
    const modalConfirmEl = document.getElementById("modal-confirm");
    let modalResolve = null;

    function closeModal(result) {
      if (!modalResolve) return;
      const resolve = modalResolve;
      modalResolve = null;
      modalOverlayEl.style.display = "none";
      const opener = modalOverlayEl._opener;
      modalOverlayEl._opener = null;
      if (opener && typeof opener.focus === "function") opener.focus();
      resolve(result);
    }

    function showModal({ title, message, confirmLabel, cancelLabel }) {
      if (modalResolve) return Promise.resolve(false);
      modalTitleEl.textContent = title || "Confirm";
      modalMessageEl.textContent = message;
      modalConfirmEl.textContent = confirmLabel || "Confirm";
      modalCancelEl.textContent = cancelLabel || "Cancel";
      modalOverlayEl._opener = document.activeElement;
      modalOverlayEl.style.display = "";
      modalConfirmEl.focus();
      return new Promise((resolve) => {
        modalResolve = resolve;
      });
    }

    modalConfirmEl.addEventListener("click", () => closeModal(true));
    modalCancelEl.addEventListener("click", () => closeModal(false));
    modalOverlayEl.addEventListener("click", (event) => {
      if (event.target === modalOverlayEl) closeModal(false);
    });
    modalOverlayEl.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.stopPropagation();
        closeModal(false);
      }
    });
    // Clicks inside the modal must not reach the document listener that
    // closes editors and menus.
    document.getElementById("modal").addEventListener("click", (e) => e.stopPropagation());

    // ------------------------------------------------------------------
    // Tab: Review & assign
    // ------------------------------------------------------------------
    // All state for the review screen lives here. Every render reads from
    // it and rebuilds the DOM; every write goes to the API and then reloads
    // it, so what's on screen is always what the server has.
    const review = {
      transactions: [],
      suggestions: new Map(), // transaction_id -> {category, confidence, match_type}
      catalog: [],            // GET /categories, sorted
      merchants: [],          // GET /merchants, sorted (dropdown + typeahead)
      subcategoriesAll: [],   // GET /subcategories (unscoped), for the bar's subcategory typeahead


      bulkField: "category",  // which field's bulk controls the bar shows; display-only
      rowError: null,         // {id, message} shown inline in a row's payment cell
      selected: new Set(),    // manual multi-select, independent of groups

      editing: null,          // {id, groupIds, spread, adding} while a row's "change" is open
      busy: false,            // an assign call is in flight
      // Explicit collapse/expand choices this page session, by group key
      // (in-memory only). Absent key = the group's default: expanded, except
      // fully-categorized similarity clusters, which default to collapsed.
      collapseState: new Map(),
      mode: "suggested",      // "suggested" (default) or "similarity"; in-memory only
      threshold: 70,          // similarity mode: 0-100, percentage of the ratio
      clusters: [],           // similarity mode: [{anchor_id, members: [{transaction_id, similarity}]}]
      similarity: new Map(),  // similarity mode: transaction_id -> 0-100 score vs its cluster's anchor
    };

    function isOpen(txn) {
      return txn.category === null || txn.category === undefined;
    }

    // A row is reviewed only when all three labels are set (Session 81 --
    // the server's review_status=complete). isOpen() stays "no category":
    // it decides whether a *category* suggestion is shown, not whether the
    // row is finished.
    function isComplete(txn) {
      return [txn.category, txn.subcategory, txn.merchant].every((v) => v !== null && v !== undefined);
    }

    function fmtAmount(n) {
      return "₹" + Number(n).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function txnLabel(n) {
      return n + (n === 1 ? " txn" : " txns");
    }

    // The suggestion the screen displays for a row, or null. Categorized
    // rows never show one (they are "done"); open rows show one only when
    // the engine found a match. Every accept on this screen writes exactly
    // this value -- the client-shown suggestion, never a recomputation.
    function suggestionFor(txn) {
      if (!isOpen(txn)) return null;
      const entry = review.suggestions.get(txn.id);
      const s = entry && entry.category;
      if (!s || s.match_type === "none") return null;
      return s; // {value, confidence, match_type}
    }

    function hasMerchant(txn) {
      return txn.merchant !== null && txn.merchant !== undefined;
    }

    // The merchant suggestion the screen displays, or null once the row has
    // a merchant. The engine never returns null here (Tier 3 falls back to
    // the description), so "no suggestion" only means "already set".
    function merchantSuggestionFor(txn) {
      if (hasMerchant(txn)) return null;
      const entry = review.suggestions.get(txn.id);
      const s = entry && entry.merchant;
      return s || null; // {value, confidence, match_type: "exact" | "fuzzy" | "from_description"}
    }

    function hasSubcategory(txn) {
      return txn.subcategory !== null && txn.subcategory !== undefined;
    }

    // The subcategory suggestion the screen displays, or null: only for rows
    // that have a category (the engine returns null otherwise) and no
    // subcategory yet. Same "accept writes exactly the displayed value" rule
    // as the category suggestion.
    function subSuggestionFor(txn) {
      if (hasSubcategory(txn)) return null;
      const entry = review.suggestions.get(txn.id);
      const s = entry && entry.subcategory;
      return s || null; // {value, confidence, match_type: "exact" | "same_as_category"}
    }

    function confClass(confidence) {
      return confidence >= 0.85 ? "high" : confidence >= 0.65 ? "mid" : "low";
    }

    function confText(s) {
      return s.match_type + " · " + Math.round(s.confidence * 100) + "%";
    }

    function buildGroups() {
      const open = review.transactions.filter(isOpen);
      // Category set but subcategory and/or merchant still missing: these
      // rows stay in view (Session 81) in their own group rather than
      // falling into the hidden "done" bucket as they did when "done" meant
      // "has a category".
      const partial = review.transactions.filter((t) => !isOpen(t) && !isComplete(t));
      const done = review.transactions.filter(isComplete);

      if (review.mode === "similarity") {
        // One group per cluster the endpoint returned, in its order, each
        // member in the order it was matched (anchor first). Rows in no
        // cluster are not shown at all in this mode -- renderReview's
        // mode note says how many, so they read as "below threshold", not
        // "missing". Category state is irrelevant to membership here.
        const byId = new Map(review.transactions.map((t) => [t.id, t]));
        review.similarity = new Map();
        const groups = [];
        for (const cluster of review.clusters) {
          const txns = [];
          for (const m of cluster.members) {
            const t = byId.get(m.transaction_id);
            if (!t) continue;
            txns.push(t);
            review.similarity.set(t.id, m.similarity);
          }
          if (txns.length < 2) continue;
          const anchor = byId.get(cluster.anchor_id) || txns[0];
          const group = makeGroup(
            "cluster",
            "Similar to \u201c" + anchor.description + "\u201d",
            txns,
            "cluster:" + cluster.anchor_id,
          );
          group.openCount = txns.filter(isOpen).length;
          // Fully-categorized clusters need no action: folded by default,
          // still openable. Anything with an open row stays expanded.
          group.defaultCollapsed = group.openCount === 0;
          groups.push(group);
        }
        // Groups needing action first; Array.prototype.sort is stable, so
        // the endpoint's order is kept within each of the two buckets.
        groups.sort((a, b) => Number(a.openCount === 0) - Number(b.openCount === 0));
        return { groups, openCount: open.length, partialCount: partial.length, doneCount: done.length };
      }

      const byCategory = new Map();
      const noSuggestion = [];
      for (const t of open) {
        const s = suggestionFor(t);
        if (!s) {
          noSuggestion.push(t);
          continue;
        }
        if (!byCategory.has(s.value)) byCategory.set(s.value, []);
        byCategory.get(s.value).push(t);
      }

      const groups = [];
      const suggested = Array.from(byCategory.entries()).sort(
        (a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]),
      );
      for (const [category, txns] of suggested) {
        groups.push(makeGroup("suggested", "Suggested: " + category, txns));
      }
      if (noSuggestion.length) {
        groups.push(makeGroup("none", "No suggestion", noSuggestion));
      }
      if (partial.length) {
        groups.push(makeGroup("partial", "Category set \u2014 subcategory or merchant missing", partial));
      }
      if ((activeTab === "reviewed" || !uncategorizedOnlyEl.checked) && done.length) {
        groups.push(makeGroup("done", activeTab === "reviewed" ? "Reviewed" : "Fully labelled", done));
      }
      return { groups, openCount: open.length, partialCount: partial.length, doneCount: done.length };
    }

    function makeGroup(kind, title, txns, key) {
      const ids = txns.map((t) => t.id);
      const total = txns.reduce((n, t) => n + Number(t.amount), 0);
      const methods = Array.from(
        new Set(txns.map((t) => suggestionFor(t)).filter(Boolean).map((s) => s.match_type)),
      );
      let meta = txnLabel(txns.length) + " · " + fmtAmount(total);
      if (kind === "done") {
        meta = txnLabel(txns.length) + " · all three labels set; select any to re-assign in bulk";
      } else if (kind === "partial") {
        meta += " · accept or set the missing labels per row";
      } else if (kind === "cluster") {
        // A cluster has no single suggested category to accept, so no
        // methods line and (below) no accept-all; the per-row controls
        // still carry each row's own suggestion.
        const openCount = txns.filter(isOpen).length;
        meta += " · " + openCount + " uncategorized";
      } else if (methods.length) {
        meta += " · " + methods.join(" + ");
      } else {
        meta += " · assign manually";
      }
      return {
        kind,
        title,
        key: key || title,
        txns,
        ids,
        meta,
        canAccept: kind !== "cluster" && methods.length > 0,
      };
    }

    function isGroupCollapsed(group) {
      if (review.collapseState.has(group.key)) return review.collapseState.get(group.key);
      return group.defaultCollapsed === true;
    }

    function toggleGroupCollapsed(group) {
      review.collapseState.set(group.key, !isGroupCollapsed(group));
    }

    function visibleIds() {
      const { groups } = buildGroups();
      const ids = new Set();
      for (const g of groups) for (const id of g.ids) ids.add(id);
      return ids;
    }

    // Global rule (Session 79): credit rows -- refunds and card payments
    // alike -- are never part of the manual multi-select. They are a
    // heterogeneous set (a refund's labels are the user's; a payment's are
    // owned by the is_payment cascade) and do not belong in one bulk apply.
    // Enforced in one place: this predicate gates the row checkbox, the
    // group checkbox's id list, and the prune, so every bulk action that
    // reads review.selected inherits it.
    function isSelectable(txn) {
      return txn.txn_type !== "credit";
    }

    function selectableIds(txns) {
      return txns.filter(isSelectable).map((t) => t.id);
    }

    function pruneSelectionToVisible() {
      // In similarity mode the selection is kept for every row in the
      // filtered set, not just the rows above threshold: a threshold or
      // mode change must not change selection state (Session 51 brief).
      const shown =
        review.mode === "similarity"
          ? new Set(selectableIds(review.transactions))
          : new Set(Array.from(visibleIds()).filter((id) => {
              const t = review.transactions.find((x) => x.id === id);
              return t && isSelectable(t);
            }));
      for (const id of Array.from(review.selected)) {
        if (!shown.has(id)) review.selected.delete(id);
      }
    }

    function setError(message) {
      if (message) {
        reviewErrorEl.textContent = message;
        reviewErrorEl.style.display = "";
      } else {
        reviewErrorEl.textContent = "";
        reviewErrorEl.style.display = "none";
      }
    }

    // One assign call, a list of per-field-optional entries. After a
    // successful write everything is re-fetched for the current filter, so
    // groups, the status line, and the catalogs reflect the write.
    //
    // Selection: by default the written ids are dropped from the manual
    // selection (a row you just labelled is done with). The bar's two bulk
    // accepts pass keepSelection so the same selection is still there for
    // the *other* button afterwards -- and the reload then skips its
    // prune-to-visible so rows that moved between groups stay selectable
    // for a following accept (Session 57). Since Session 81 a row leaves
    // the "needs review" fetch only when all three labels are set, so a
    // category-only accept keeps it in view (in the partial group).
    function assign(pairs, options) {
      const keepSelection = Boolean(options && options.keepSelection);
      if (review.busy || pairs.length === 0) return Promise.resolve();
      review.busy = true;
      setError("");
      return postJSON("/transactions/category", { assignments: pairs })
        .then(() => {
          if (!keepSelection) {
            for (const p of pairs) review.selected.delete(p.transaction_id);
          }
          review.editing = null;
          // busy is cleared *before* the reload renders, otherwise every
          // button would be rebuilt disabled and stay that way.
          review.busy = false;
          return loadReview(currentFilters(), { skipPrune: keepSelection });
        })
        .catch((error) => {
          review.busy = false;
          setError("Error saving category: " + error.message);
        });
    }

    // Each row its own displayed category suggestion; rows without one are
    // skipped. Used by group "accept all", the row-level accept, and the
    // bar's "Accept category suggestions" -- the client-shown value, never a
    // recompute. Category only: merchant has its own bulk path below.
    function acceptPairs(txns) {
      const pairs = [];
      for (const t of txns) {
        const s = suggestionFor(t);
        if (s) pairs.push({ transaction_id: t.id, category: s.value });
      }
      return pairs;
    }

    // The bar's "Accept merchant suggestions": one merchant-only entry per
    // selected row whose displayed merchant suggestion was *learned* (exact
    // or fuzzy). Tier 3 "from_description" rows are excluded here entirely
    // -- not counted, not written -- because every merchant-less row has
    // one, so a bulk accept would otherwise stamp raw descriptions across
    // the whole selection in one click (Session 57). Those rows keep their
    // per-row accept button, which is a deliberate one-at-a-time act.
    function acceptMerchantPairs(txns) {
      const pairs = [];
      for (const t of txns) {
        const m = merchantSuggestionFor(t);
        if (m && m.match_type !== "from_description") {
          pairs.push({ transaction_id: t.id, merchant: m.value });
        }
      }
      return pairs;
    }

    // Subcategory bulk accept (Session 79), the same shape as merchant's:
    // one subcategory-only entry per selected row whose displayed
    // suggestion was *learned* (match_type "exact"). "same_as_category" is
    // excluded for exactly the reason "from_description" is above: it is a
    // fallback with a default 1.0 confidence, not evidence, and every row
    // with a category but no subcategory has one -- a bulk accept would
    // otherwise copy category names into the subcategory column across the
    // whole selection. Those rows keep their per-row accept.
    function acceptSubcategoryPairs(txns) {
      const pairs = [];
      for (const t of txns) {
        const sc = subSuggestionFor(t);
        if (sc && sc.match_type !== "same_as_category") {
          pairs.push({ transaction_id: t.id, subcategory: sc.value });
        }
      }
      return pairs;
    }

    // One assign entry per id, carrying only the field being written -- the
    // other label on each row is left as it is (Session 53 endpoint shape).
    function uniformPairs(ids, category) {
      return ids.map((id) => ({ transaction_id: id, category }));
    }

    function uniformSubPairs(ids, subcategory) {
      return ids.map((id) => ({ transaction_id: id, subcategory }));
    }

    function uniformMerchantPairs(ids, merchant) {
      return ids.map((id) => ({ transaction_id: id, merchant }));
    }

    // Every transaction in view -- categorized or not -- goes to the
    // clustering endpoint, in the table's own order (which is the anchor
    // order the endpoint honours). Empty input short-circuits to [].
    function fetchClusters(transactions) {
      const ids = transactions.map((t) => t.id);
      if (ids.length === 0) return Promise.resolve([]);
      return postJSON("/transactions/clusters", {
        transaction_ids: ids,
        threshold: review.threshold,
      }).then((body) => body.clusters);
    }

    // Threshold and mode changes re-cluster the transactions already
    // loaded rather than re-fetching everything. Own sequence counter: a
    // slow cluster response for an older threshold must not land after a
    // newer one, and this must not bump requestSeq (which would discard an
    // in-flight table load).
    let clusterSeq = 0;

    function reloadClusters() {
      const seq = ++clusterSeq;
      reviewModeNoteEl.textContent = "Grouping\u2026";
      reviewModeNoteEl.style.display = "";
      return fetchClusters(review.transactions)
        .then((clusters) => {
          if (seq !== clusterSeq) return;
          review.clusters = clusters;
          review.editing = null;
          renderReview();
        })
        .catch((error) => {
          if (seq !== clusterSeq) return;
          setError("Error grouping by similarity: " + error.message);
        });
    }

    function loadReview(filters, options) {
      const skipPrune = Boolean(options && options.skipPrune);
      const seq = ++requestSeq;
      reviewStatusEl.textContent = "Loading…";

      // The toggle is a real row-set filter (Session 81): on, the server
      // returns only rows with any label missing; off, every filtered row.
      const reviewParams = buildParams(filters);
      if (activeTab === "reviewed") reviewParams.set("review_status", "complete");
      else if (uncategorizedOnlyEl.checked) reviewParams.set("review_status", "incomplete");
      const transactionsP = fetchJSON(withParams("/transactions", reviewParams));
      const catalogP = fetchJSON("/categories");
      const merchantsP = fetchJSON("/merchants");
      const subcategoriesP = fetchJSON("/subcategories");
      const clustersP = transactionsP.then((transactions) =>
        review.mode === "similarity" ? fetchClusters(transactions) : review.clusters,
      );
      // Suggestions are only asked for open (uncategorized) rows: those are
      // the only ones the screen shows a suggestion for, and it's one batch
      // call however many there are.
      const suggestionsP = transactionsP.then((transactions) => {
        const openIds = transactions.filter(isOpen).map((t) => t.id);
        if (openIds.length === 0) return { suggestions: [] };
        return postJSON("/transactions/suggestions", { transaction_ids: openIds });
      });

      return Promise.all([transactionsP, suggestionsP, catalogP, merchantsP, subcategoriesP, clustersP])
        .then(([transactions, suggestionBody, catalog, merchants, subcategoriesAll, clusters]) => {
          if (seq !== requestSeq) return;
          if (!hasDateFilter(filters)) applyDateBounds(transactions);
          review.transactions = transactions;
          review.suggestions = new Map(
            suggestionBody.suggestions.map((s) => [s.transaction_id, s]),
          );
          review.catalog = catalog;
          review.merchants = merchants;
          review.subcategoriesAll = subcategoriesAll;
          review.clusters = clusters;
          review.rowError = null;
          review.editing = null;
          // Selection survives a reload but only for rows still on screen --
          // except right after a bulk accept, which keeps it whole so the
          // other bulk button can act on the same rows (see assign()).
          if (!skipPrune) pruneSelectionToVisible();
          renderReview();
        })
        .catch((error) => {
          if (seq !== requestSeq) return;
          reviewStatusEl.textContent = "Error loading transactions: " + error.message;
          reviewTableEl.style.display = "none";
          selectionBarEl.style.display = "none";
          nothingLeftEl.style.display = "none";
        });
    }

    function renderReview() {
      const { groups, openCount, partialCount, doneCount } = buildGroups();
      const total = review.transactions.length;

      reviewBodyEl.textContent = "";
      nothingLeftEl.style.display = "none";
      reviewModeNoteEl.style.display = "none";

      const similarity = review.mode === "similarity";
      thresholdLabelEl.style.display = similarity ? "" : "none";
      // "Needs review only" is a row-set filter since Session 81, so it
      // applies in both grouping modes (it used to be a client-side regroup
      // that similarity mode ignored).
      uncategorizedOnlyEl.disabled = false;
      uncategorizedOnlyLabelEl.style.opacity = "";

      if (total === 0) {
        reviewStatusEl.textContent = activeTab === "reviewed"
          ? "No fully labelled transactions for these filters."
          : "No transactions found.";
        reviewTableEl.style.display = "none";
        selectionBarEl.style.display = "none";
        return;
      }

      const needsReview = openCount + partialCount;
      reviewStatusEl.textContent = activeTab === "reviewed"
        ? total + " fully labelled transactions"
        : total + " transactions · " + needsReview + " need review" +
          (partialCount ? " (" + partialCount + " with only category set)" : "") +
          " · " + doneCount + " fully labelled";

      renderSelectionBar();

      if (similarity) {
        const shown = groups.reduce((n, g) => n + g.ids.length, 0);
        const hidden = total - shown;
        reviewModeNoteEl.textContent =
          shown + " of " + total + " shown" +
          (hidden > 0
            ? " \u2014 " + hidden + " with no match at " + review.threshold + "% or above"
            : "");
        reviewModeNoteEl.style.display = "";
        if (groups.length === 0) {
          nothingLeftEl.textContent =
            "No two descriptions are " + review.threshold + "% similar or more. " +
            "Lower the threshold to find looser matches.";
          nothingLeftEl.style.display = "";
        }
      } else if (activeTab !== "reviewed" && openCount + partialCount === 0) {
        nothingLeftEl.textContent = "Nothing left to review for these filters.";
        nothingLeftEl.style.display = "";
      }

      if (groups.length === 0) {
        reviewTableEl.style.display = "none";
        return;
      }

      for (const group of groups) {
        reviewBodyEl.appendChild(renderGroupHeader(group));
        // Collapsed groups keep their header (and its checkbox/accept-all);
        // only the rows are withheld. Keyed by title, which is the group's
        // identity across re-renders.
        if (isGroupCollapsed(group)) continue;
        for (const txn of group.txns) {
          reviewBodyEl.appendChild(renderRow(txn, group));
        }
      }
      reviewTableEl.style.display = "";

      // Focus whatever the open editor wants focused, now that it exists.
      if (review.editing) {
        const target = reviewBodyEl.querySelector("[data-autofocus]");
        if (target) target.focus();
      }
    }

    // --- selection bar -------------------------------------------------
    function renderSelectionBar() {
      selectionBarEl.textContent = "";
      const selectedTxns = review.transactions.filter((t) => review.selected.has(t.id));
      if (selectedTxns.length === 0) {
        selectionBarEl.style.display = "none";
        selectionBarEl.classList.remove("stuck");
        panelReviewEl.classList.remove("has-selection");
        return;
      }
      const selectedIds = selectedTxns.map((t) => t.id);
      const amount = selectedTxns.reduce((n, t) => n + Number(t.amount), 0);
      const categoryPairs = acceptPairs(selectedTxns);
      const merchantPairs = acceptMerchantPairs(selectedTxns);
      const subcategoryPairs = acceptSubcategoryPairs(selectedTxns);

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = selectedIds.length + " selected · " + fmtAmount(amount);
      selectionBarEl.appendChild(label);

      // Category / Merchant toggle: a display-only filter over which field's
      // typeahead and accept button are shown. It never touches the
      // selection, both options are always clickable, and the count above
      // stays regardless. Flip to Merchant after a category bulk accept and
      // the same rows are still there for the merchant one (Session 57's
      // keepSelection), which is the whole point of not restricting it.
      const seg = document.createElement("div");
      seg.className = "segmented";
      seg.setAttribute("role", "group");
      seg.setAttribute("aria-label", "Bulk field");
      for (const [field, text] of [["category", "Category"], ["subcategory", "Sub Category"], ["merchant", "Merchant"]]) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = text;
        b.setAttribute("aria-pressed", String(review.bulkField === field));
        b.addEventListener("click", () => {
          if (review.bulkField === field) return;
          review.bulkField = field;
          renderSelectionBar(); // bar only; rows and selection untouched
        });
        seg.appendChild(b);
      }
      selectionBarEl.appendChild(seg);

      // The two fields' controls: one typeahead (one typed value to every
      // selected transaction) and one bulk accept (its own assign call, N
      // counting only rows with an applicable suggestion for that field --
      // for merchant, learned exact/fuzzy only; see acceptMerchantPairs).
      // Only the toggled field's pair is rendered. Subcategory is
      // deliberately not here.
      const controls = {
        category: {
          pairs: categoryPairs,
          label: "Accept category suggestions (" + categoryPairs.length + ")",
          title:
            "Writes each selected transaction its own suggested category (as displayed); " +
            "rows with no category suggestion are left as they are",
        },
        subcategory: {
          pairs: subcategoryPairs,
          label: "Accept subcategory suggestions (" + subcategoryPairs.length + ")",
          title:
            "Writes each selected transaction its own learned subcategory suggestion (exact, " +
            "as displayed); \u201csame as category\u201d rows are skipped here and can be " +
            "accepted one at a time",
        },
        merchant: {
          pairs: merchantPairs,
          label: "Accept merchant suggestions (" + merchantPairs.length + ")",
          title:
            "Writes each selected transaction its own learned merchant suggestion (exact or " +
            "fuzzy, as displayed); \u201cfrom description\u201d rows are skipped here and " +
            "can be accepted one at a time",
        },
      }[review.bulkField];

      const acceptBtn = document.createElement("button");
      acceptBtn.type = "button";
      acceptBtn.textContent = controls.label;
      acceptBtn.disabled = controls.pairs.length === 0 || review.busy;
      acceptBtn.title = controls.title;
      acceptBtn.addEventListener("click", () => assign(controls.pairs, { keepSelection: true }));
      selectionBarEl.appendChild(acceptBtn);

      const clear = document.createElement("button");
      clear.type = "button";
      clear.className = "link";
      clear.textContent = "clear selection";
      clear.addEventListener("click", () => {
        review.selected.clear();
        renderReview();
      });
      selectionBarEl.appendChild(clear);

      selectionBarEl.style.display = "";
      panelReviewEl.classList.add("has-selection");
      updateBarOffset();
    }

    // Group headers stick just beneath the bar (CSS reads --bar-offset), so
    // the offset must track the bar's real height, which changes as its
    // contents wrap or the N labels change. Measured after each render and
    // whenever the bar resizes.
    function updateBarOffset() {
      const gap = 6;
      const height = selectionBarEl.offsetHeight;
      const top = parseFloat(getComputedStyle(selectionBarEl).top) || 0;
      panelReviewEl.style.setProperty("--bar-offset", top + height + gap + "px");
    }
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(() => {
        if (selectionBarEl.style.display !== "none") updateBarOffset();
      }).observe(selectionBarEl);
    }

    // "Stuck" detection: the 1px sentinel sits where the bar's top would be
    // in normal flow. Once it scrolls past the bar's sticky top, the bar is
    // pinned and gets its floating shadow; when it comes back, the shadow
    // goes. rootMargin pulls the observed top edge down by the sticky offset
    // (+1px) so the flip happens exactly at the pin point.
    if (typeof IntersectionObserver !== "undefined") {
      const stickyTop = parseFloat(getComputedStyle(selectionBarEl).top) || 0;
      new IntersectionObserver(
        ([entry]) => {
          const shown = selectionBarEl.style.display !== "none";
          selectionBarEl.classList.toggle("stuck", shown && !entry.isIntersecting);
        },
        { rootMargin: "-" + (Math.ceil(stickyTop) + 1) + "px 0px 0px 0px", threshold: 0 },
      ).observe(selectionBarSentinelEl);
    }

    // --- group header --------------------------------------------------
    function renderGroupHeader(group) {
      const tr = document.createElement("tr");
      const isCollapsed = isGroupCollapsed(group);
      tr.className = "group" + (isCollapsed ? " collapsed" : "");
      const td = document.createElement("td");
      td.colSpan = 9;
      const head = document.createElement("div");
      head.className = "group-head";

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "toggle";
      toggle.setAttribute("aria-expanded", String(!isCollapsed));
      toggle.setAttribute("aria-label", (isCollapsed ? "Expand " : "Collapse ") + group.title);
      toggle.addEventListener("click", () => {
        toggleGroupCollapsed(group);
        renderReview();
      });
      head.appendChild(toggle);

      // Only the group's selectable (non-credit) rows take part.
      const groupSelectable = selectableIds(group.txns);
      const allIn = groupSelectable.length > 0 && groupSelectable.every((id) => review.selected.has(id));
      const someIn = !allIn && groupSelectable.some((id) => review.selected.has(id));
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = allIn;
      cb.indeterminate = someIn;
      cb.disabled = groupSelectable.length === 0;
      cb.title = groupSelectable.length
        ? "Select every debit row in this group"
        : "No bulk-selectable rows in this group";
      cb.addEventListener("change", () => {
        if (allIn) for (const id of groupSelectable) review.selected.delete(id);
        else for (const id of groupSelectable) review.selected.add(id);
        renderReview();
      });
      head.appendChild(cb);

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = group.title;
      head.appendChild(title);

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = group.meta;
      head.appendChild(meta);

      const spacer = document.createElement("span");
      spacer.className = "spacer";
      head.appendChild(spacer);

      if (group.canAccept) {
        // One pair per row, each row's own displayed suggestion.
        const pairs = acceptPairs(group.txns);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "small";
        btn.textContent = "accept all " + pairs.length;
        btn.disabled = review.busy;
        btn.addEventListener("click", () => assign(pairs));
        head.appendChild(btn);
      }

      td.appendChild(head);
      tr.appendChild(td);
      return tr;
    }

    // --- row -------------------------------------------------------------
    function renderRow(txn, group) {
      const tr = document.createElement("tr");
      const isSelected = review.selected.has(txn.id);
      const editingField =
        review.editing !== null && review.editing.id === txn.id ? review.editing.field : null;
      if (editingField !== null) tr.className = "editing"; // any editor open
      else if (isSelected) tr.className = "selected";

      const selectCell = document.createElement("td");
      selectCell.className = "select";
      if (isSelectable(txn)) {
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = isSelected;
        cb.addEventListener("change", () => {
          if (cb.checked) review.selected.add(txn.id);
          else review.selected.delete(txn.id);
          renderReview();
        });
        selectCell.appendChild(cb);
      } else {
        // Credit rows carry no checkbox at all (Session 79 global rule).
        selectCell.title = "Credits are not bulk-selectable";
      }
      tr.appendChild(selectCell);

      const dateCell = document.createElement("td");
      dateCell.className = "num";
      dateCell.textContent = txn.txn_date;
      tr.appendChild(dateCell);

      const descCell = document.createElement("td");
      descCell.textContent = txn.description;
      tr.appendChild(descCell);

      tr.appendChild(typeCell(txn));

      const amountCell = document.createElement("td");
      amountCell.className = "num amount " + txn.txn_type;
      amountCell.textContent = fmtAmount(txn.amount);
      tr.appendChild(amountCell);

      // The three label cells share one inline editor (Session 82).
      tr.appendChild(renderLabelCell(txn, "merchant", editingField === "merchant"));
      tr.appendChild(renderLabelCell(txn, "category", editingField === "category"));
      tr.appendChild(renderLabelCell(txn, "subcategory", editingField === "subcategory"));
      tr.appendChild(renderPaymentCell(txn));
      return tr;
    }

    // --- card payment cell (Session 62) -------------------------------------
    // Only credit rows get a checkbox; a debit can never be a payment to the
    // card, so its cell is simply empty -- no disabled control, no
    // placeholder. Any change goes through the confirmation modal first, and
    // the checkbox's own state is not allowed to flip until the write has
    // succeeded: the click is cancelled and the box is redrawn from state.
    const PAYMENT_LABEL = "Credit Card Payment";

    function renderPaymentCell(txn) {
      const cell = document.createElement("td");
      cell.className = "payment";
      if (txn.txn_type !== "credit") return cell;

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = Boolean(txn.is_payment);
      cb.disabled = review.busy;
      cb.title = cb.checked
        ? "Marked as a payment to the card (not spend)"
        : "Mark this credit as a payment to the card";
      cb.addEventListener("click", (event) => {
        // Don't let the box toggle itself; the modal decides.
        event.preventDefault();
        event.stopPropagation();
        requestPaymentFlag(txn, !txn.is_payment);
      });
      cell.appendChild(cb);

      if (review.rowError && review.rowError.id === txn.id) {
        const err = document.createElement("span");
        err.className = "row-error";
        err.textContent = review.rowError.message;
        cell.appendChild(err);
      }
      return cell;
    }

    function requestPaymentFlag(txn, wanted) {
      if (review.busy) return;
      // Every row carries its own bank (Session 63), whatever the filters.
      const message = wanted
        ? "Marking this as a Credit Card Payment will set Category and Subcategory to " +
          "\u2018" + PAYMENT_LABEL + "\u2019 and Merchant to \u2018" + txn.bank + "\u2019, " +
          "replacing any existing values on this transaction. This affects expense " +
          "totals in the analytics dashboard. Confirm?"
        : "Unmarking this as a Credit Card Payment will clear Category, Subcategory, and " +
          "Merchant back to unset. This affects expense totals in the analytics dashboard. " +
          "Confirm?";
      showModal({
        title: wanted ? "Mark as credit card payment" : "Unmark credit card payment",
        message,
        confirmLabel: wanted ? "Mark as payment" : "Unmark",
      }).then((confirmed) => {
        if (!confirmed) return; // Cancel: no write, box already unchanged
        setPaymentFlag(txn, wanted);
      });
    }

    // One write, then the row's local state is set to what the endpoint's
    // cascade contract guarantees -- no re-read: the merchant the cascade
    // writes is the card's bank, which the row already carries. On uncheck
    // the row re-enters the suggestion flow, so its suggestions are fetched
    // (one id) as for any open row. A 400/422 shows inline in the cell and
    // changes nothing.
    function setPaymentFlag(txn, wanted) {
      review.busy = true;
      review.rowError = null;
      setError("");
      postJSON("/transactions/category", {
        assignments: [{ transaction_id: txn.id, is_payment: wanted }],
      })
        .then(() => {
          review.busy = false;
          if (wanted) {
            txn.is_payment = 1;
            txn.category = PAYMENT_LABEL;
            txn.subcategory = PAYMENT_LABEL;
            txn.merchant = txn.bank;
            renderReview();
            return null;
          }
          txn.is_payment = 0;
          txn.category = null;
          txn.subcategory = null;
          txn.merchant = null;
          return postJSON("/transactions/suggestions", { transaction_ids: [txn.id] }).then(
            (body) => {
              for (const s of body.suggestions) review.suggestions.set(s.transaction_id, s);
              renderReview();
            },
            () => renderReview(), // suggestions are a convenience; the write stood
          );
        })
        .catch((error) => {
          review.busy = false;
          review.rowError = { id: txn.id, message: "Not saved: " + error.message };
          renderReview(); // redraws the box from unchanged state
        });
    }

    // --- inline label editor (Session 82) ---------------------------------
    // One cell renderer for merchant / category / subcategory, replacing the
    // accept / change / spread / add-new buttons. Three display states:
    //   saved value            -> plain text
    //   unset, suggestion      -> ghost text + its badge; clicking the ghost
    //                             accepts it at once (the old "accept")
    //   unset, no suggestion   -> a dash
    // plus a small edit icon in every state that opens the combo editor.
    const LABEL_FIELDS = {
      category: {
        label: "category",
        suggestion: (t) => suggestionFor(t),
        options: () => review.catalog,
        pairs: (ids, v) => uniformPairs(ids, v),
        fallbackType: null,
      },
      subcategory: {
        label: "subcategory",
        suggestion: (t) => subSuggestionFor(t),
        options: () => review.subcategoriesAll,
        pairs: (ids, v) => uniformSubPairs(ids, v),
        fallbackType: "same_as_category",
        fallbackWords: "same as category",
      },
      merchant: {
        label: "merchant",
        suggestion: (t) => merchantSuggestionFor(t),
        options: () => review.merchants,
        pairs: (ids, v) => uniformMerchantPairs(ids, v),
        fallbackType: "from_description",
        fallbackWords: "from description",
      },
    };

    function savedValue(txn, field) {
      const v = txn[field];
      return v === null || v === undefined ? null : v;
    }

    // Which rows a save from this row's editor applies to: every checked
    // row when this row is itself checked and 2+ are checked (bulk apply,
    // replacing the bar's typed assign); otherwise just this row. Editing an
    // unchecked row is never implicitly bulk, whatever else is checked.
    function saveTargets(txn) {
      if (review.selected.has(txn.id) && review.selected.size >= 2) {
        return Array.from(review.selected);
      }
      return [txn.id];
    }

    function saveLabel(txn, field, value) {
      const trimmed = String(value || "").trim();
      if (!trimmed) return;
      const spec = LABEL_FIELDS[field];
      review.editing = null;
      assign(spec.pairs(saveTargets(txn), trimmed));
    }

    function renderLabelCell(txn, field, isEditing) {
      const spec = LABEL_FIELDS[field];
      const cell = document.createElement("td");
      cell.className = "category-cell label-cell " + field + "-cell";
      const saved = savedValue(txn, field);
      const s = saved === null ? spec.suggestion(txn) : null;

      // Similarity mode's per-row score lives in the category cell (Session 52).
      if (field === "category" && review.mode === "similarity" && review.similarity.has(txn.id)) {
        const sim = document.createElement("span");
        sim.className = "badge similarity";
        sim.textContent = "similarity: " + Math.round(review.similarity.get(txn.id)) + "%";
        sim.title = "How closely this description matches the group\u2019s first row";
        cell.appendChild(sim);
      }

      if (isEditing) {
        cell.appendChild(renderInlineEditor(txn, field, saved, s));
        return cell;
      }

      if (saved !== null) {
